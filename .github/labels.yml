# Labels for conexus-os issues and pull requests. `node scripts/labels.mjs` shows the plan and
# `node scripts/labels.mjs --apply` creates or updates them on GitHub. Labels not listed here are
# left alone. Every value is double-quoted because the Factory's names contain ": ".

# Lanes and operator attention: docs/development/delivery.md.
- name: "lane:fast"
  color: "0e8a16"
  description: "No Q trigger, one pull request, appetite P (up to 1 day). See docs/development/delivery.md"
- name: "lane:shaped"
  color: "1d76db"
  description: "A shaped bet: across modules or more than one pull request, no Q trigger"
- name: "lane:qualification"
  color: "5319e7"
  description: "A Q trigger holds: task in docs/tasks, evidence, independent review"
- name: "needs:aprovo"
  color: "d93f0b"
  description: "Operator Aprovo: real-data migration, security or auth, requested screen. No auto-merge"
- name: "needs:operator"
  color: "fbca04"
  description: "Waits on the operator for a fact or an action"
- name: "type:bug"
  color: "d73a4a"
  description: "Behavior differs from the product contract"
- name: "type:change"
  color: "c5def5"
  description: "A unit of work on Conexus OS"

# Labels the Mastra Factory skills add (@mastra/factory 0.17.0 in ~/dev-factory): factory-triage,
# factory-review, factory-rereview and factory-complete-issue.
- name: "status: needs triage"
  color: "ededed"
  description: "Factory triage has not run yet"
- name: "status: auto-triaged"
  color: "c2e0c6"
  description: "Factory triage finished"
- name: "status: needs approval"
  color: "fbca04"
  description: "Factory triage: a maintainer approves before work starts"
- name: "status: pending-close"
  color: "bfdadc"
  description: "Factory marked the work done; the issue waits to close"
- name: "status:auto-approved"
  color: "0e8a16"
  description: "Factory review verdict: approve"
- name: "status:changes-requested"
  color: "b60205"
  description: "Factory review verdict: request changes"
- name: "effort:low"
  color: "c5def5"
  description: "Factory triage: low effort"
- name: "effort:medium"
  color: "7aa6e0"
  description: "Factory triage: medium effort"
- name: "effort:high"
  color: "1d4ed8"
  description: "Factory triage: high effort"
- name: "impact:low"
  color: "fef2c0"
  description: "Factory triage: low impact"
- name: "impact:medium"
  color: "f9d0a4"
  description: "Factory triage: medium impact"
- name: "impact:high"
  color: "e99695"
  description: "Factory triage: high impact"

# The dev Factory host parks an issue with this label in Work > Intake (~/dev-factory,
# src/mastra/github-rules.ts). It is separate from "status: needs triage".
- name: "needs-triage"
  color: "d4c5f9"
  description: "Needs a person before the dev Factory works on it"
