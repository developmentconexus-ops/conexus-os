name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: conexus_test
          POSTGRES_PASSWORD: s6-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # scripts/generate-hub-baseline.mjs reads the schema back with pg_dump, and pg_dump refuses a
      # server newer than itself. The runner image ships the 16 client; the service is 17.10.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify
      - run: git diff --check
      - run: test -z "$(git status --porcelain)"
