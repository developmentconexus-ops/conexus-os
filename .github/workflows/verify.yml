name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request makes the older run moot.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The graph runs as five groups, each on its own runner with its own PostgreSQL and CPU, so no
  # step shares a machine resource with a step of another group (see VERIFY_GROUPS in
  # scripts/conexus-verify.mjs). The first group to fail cancels the others.
  group:
    name: verify (${{ matrix.group }})
    strategy:
      matrix:
        group: [builder-ui, browser, postgres, rest, live]
    # A draft is work in progress: its author runs the touched suites locally and pushes as often as
    # needed. CI runs once, when the pull request is marked ready for review, and on every push after.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: conexus_test
          POSTGRES_PASSWORD: s6-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm
      # A pull request that changes only documentation runs only the checks that read documentation.
      # The test is a diff inside this job, not a workflow-level paths filter, so the required `verify`
      # check always reports. A push to main has no base and runs everything.
      - name: Classify the change
        id: scope
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: node scripts/ci-change-scope.mjs ${BASE_REF:+--base "origin/$BASE_REF"}
      # node_modules is restored whole and keyed on everything that decides its content: the lockfile,
      # package.json, the Node version and the runner OS and architecture. On a hit npm ci is skipped.
      # On a miss it runs, and the result is saved right away, before verification adds build output
      # under node_modules/.cache that must not enter the cache.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: node scripts/ci-install.mjs
      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # The browser download is cached on the installed Playwright version. The OS libraries it needs
      # live outside the cache, so they are installed on every run.
      - name: Playwright version
        id: playwright
        if: steps.scope.outputs.docs_only != 'true' && (matrix.group == 'browser' || matrix.group == 'builder-ui' || matrix.group == 'live')
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser
        id: browser
        if: steps.scope.outputs.docs_only != 'true' && (matrix.group == 'browser' || matrix.group == 'builder-ui' || matrix.group == 'live')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.scope.outputs.docs_only != 'true' && (matrix.group == 'browser' || matrix.group == 'builder-ui' || matrix.group == 'live') && steps.browser.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.scope.outputs.docs_only != 'true' && (matrix.group == 'browser' || matrix.group == 'builder-ui' || matrix.group == 'live') && steps.browser.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium
      # The application runner's worker is a rootless bubblewrap sandbox, and the runner refuses to
      # start without unprivileged user namespaces. ubuntu-24.04 restricts them through AppArmor.
      - name: Rootless sandbox for the application runner suite
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          command -v bwrap || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The baseline check reads the schema back with pg_dump, which must be at least the server's
      # version. The service container's own pg_dump always is, so no client is installed here.
      # Application data lives on its own PostgreSQL cluster, apart from the Hub's. The runner allows
      # passwordless sudo, so the test Applications cluster gets the same dedicated, mounted
      # filesystem an installation gets, at a fraction of the size, instead of an ordinary directory.
      - name: Start the Applications PostgreSQL test cluster
        if: steps.scope.outputs.docs_only != 'true' && matrix.group == 'postgres'
        run: |
          sudo bash scripts/mount-application-cluster-storage.sh install "$RUNNER_TEMP/conexus-apps.img" 1024 "$RUNNER_TEMP/conexus-apps"
          printf '%s' s6-ci-test-only > "$RUNNER_TEMP/conexus-apps-password"
          bash scripts/run-application-cluster.sh conexus-ci-apps 5434 "$RUNNER_TEMP/conexus-apps" "$RUNNER_TEMP/conexus-apps-password"
          for attempt in $(seq 1 60); do docker exec conexus-ci-apps pg_isready -U postgres -h 127.0.0.1 && break; sleep 1; done
          docker exec conexus-ci-apps pg_isready -U postgres -h 127.0.0.1
      # Project roles log in only with the application runner's certificate. The test cluster gets the
      # TLS files and pg_hba rules an installation gets; the Project role suites prove them.
      - name: Confine application roles on the test Applications cluster
        if: steps.scope.outputs.docs_only != 'true' && matrix.group == 'postgres'
        run: node scripts/confine-application-cluster.mjs --container conexus-ci-apps --authority-dir "$RUNNER_TEMP/conexus-app-authority" --tls-dir "$RUNNER_TEMP/conexus-app-tls" --database '/^conexus_apps_[0-9a-f]{12}$'
      - name: Verify the documentation checks only
        if: steps.scope.outputs.docs_only == 'true' && matrix.group == 'rest'
        run: npm run verify:docs
      - name: Verify the ${{ matrix.group }} group
        run: npm run conexus:verify -- --scope candidate --group ${{ matrix.group }}
        if: steps.scope.outputs.docs_only != 'true'
        env:
          # The live group's evidence (screenshots, the page console, the Hub's log) is kept on failure, below.
          CONEXUS_VERIFY_EVIDENCE: ${{ runner.temp }}/conexus-verify-evidence
          CONEXUS_VERIFY_STATE: ${{ runner.temp }}/conexus-verify-state
          CONEXUS_TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
          CONEXUS_TEST_APP_TLS_DIR: ${{ runner.temp }}/conexus-app-tls
          CONEXUS_TEST_APP_DB_HOST: 127.0.0.1
          CONEXUS_TEST_APP_DB_PORT: '5434'
          CONEXUS_TEST_APP_DB_USER: postgres
          CONEXUS_TEST_APP_DB_PASSWORD: s6-ci-test-only
      - name: Keep the live group's evidence
        if: failure() && matrix.group == 'live'
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence
          path: ${{ runner.temp }}/conexus-verify-evidence
          if-no-files-found: ignore
      - run: git diff --check
      # A guard that fails without naming what it found costs a whole CI cycle to diagnose.
      - name: The working tree is unchanged by verification
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "verification left the working tree dirty:"
            git status --porcelain
            git diff --stat
            exit 1
          fi

  # The one required check. It reports success only when every group did, so branch protection keeps
  # a single name, `verify`, and a group that fails or is cancelled fails it.
  verify:
    name: verify
    needs: group
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Every group passed
        env:
          GROUPS_RESULT: ${{ needs.group.result }}
        run: |
          echo "groups: $GROUPS_RESULT"
          test "$GROUPS_RESULT" = success
