name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: conexus_test
          POSTGRES_PASSWORD: s6-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run r1:a0:g0:verify
      - run: npm ci --prefix qualification/4f/r1-project-cognition-admission --ignore-scripts
      - run: npm test --prefix qualification/4f/r1-project-cognition-admission
      - run: npm run r1:s2:generate
      - run: git diff --exit-code -- apps/hub/src/generated/s2-routes.ts apps/web/src/generated/workspace-client.ts
      - run: npm run r1:s2:hub:typecheck
      - run: npm run r1:s2:http
      - run: node --test --test-concurrency=1 tests/implementation/r1-s2-reads.test.mjs
      - run: node --test --test-concurrency=1 tests/repository/import-law.test.mjs
      - run: npx --no-install biome check apps/hub/src apps/web/src packages/canonical-json/src packages/profile-compiler/src scripts/check-import-law.mjs scripts/generate-r1-s2-contracts.mjs tests/implementation/r1-s2-http.test.mjs tests/implementation/r1-s2-reads.test.mjs tests/repository/import-law.test.mjs
      - run: bash -n tests/implementation/r1-s2-live-runner.sh && node --check tests/implementation/r1-s2-live-setup.mjs && node --check tests/implementation/r1-s2-live-browser.spec.mjs
      - run: npm run r1:a0:web:typecheck
      - run: npm run r1:r1c14:native:check
      - run: npm run rb:first:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r2:p1:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r2:p2:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r2:p3:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r1:s4:p2:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r2:p4:authority
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r2:p6:a:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r1:s6:p0:check
      - run: npm run r1:s6:p0:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r1:s6:p1:check
      - run: npm run r1:s6:p1:postgres
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r1:s6:p2:check
      - run: npm run r1:s6:p3:check
      - run: npm run r1:s6:p5:check
      - run: npm run r1:s6:closure:composed
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run r1:rc01:walkthrough:verify
        env:
          CONEXUS_TEST_DB_HOST: 127.0.0.1
          CONEXUS_TEST_DB_PORT: 5432
          CONEXUS_TEST_DB_NAME: conexus_test
          CONEXUS_TEST_DB_USER: postgres
          CONEXUS_TEST_DB_PASSWORD: s6-ci-test-only
      - run: npm run verify
      - run: npm run repository:check:extended
      - run: git diff --check
      - run: test -z "$(git status --porcelain)"
