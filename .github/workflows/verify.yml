name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request makes the older run moot.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    # A draft is work in progress: its author runs the touched suites locally and pushes as often as
    # needed. CI runs once, when the pull request is marked ready for review, and on every push after.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: conexus_test
          POSTGRES_PASSWORD: s6-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A pull request diffs against its base branch to decide whether the browser suites (Playwright
      # install plus the browser-tagged verify steps) have anything to prove. A push to main always
      # runs them: there is no base branch to diff against, and main is where the signal has to hold.
      - name: Decide whether browser suites are needed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if echo "$changed" | grep -Eq '^(apps/web/|packages/brand/|apps/keycloak-theme/|apps/hub/src/builder/application-|tests/implementation/builder-application-|tests/implementation/[^/]*browser[^/]*$|tests/implementation/web-dev-server\.mjs$|package-lock\.json$|scripts/conexus-verify\.mjs$)'; then
            echo "browser-relevant change detected; browser suites will run"
          else
            echo "CONEXUS_VERIFY_SKIP_BROWSER=1" >> "$GITHUB_ENV"
            echo "no browser-relevant change; browser suites will be skipped"
          fi
      - name: Install Playwright Chromium
        if: env.CONEXUS_VERIFY_SKIP_BROWSER != '1'
        run: npx --no-install playwright install --with-deps chromium
      # The application runner's worker is a rootless bubblewrap sandbox, and the runner refuses to
      # start without unprivileged user namespaces. ubuntu-24.04 restricts them through AppArmor.
      - name: Rootless sandbox for the application runner suite
        run: |
          command -v bwrap || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The baseline check reads the schema back with pg_dump, which must be at least the server's
      # version. The service container's own pg_dump always is, so no client is installed here.
      # Application data lives on its own PostgreSQL cluster, apart from the Hub's. The runner allows
      # passwordless sudo, so the test Applications cluster gets the same dedicated, mounted
      # filesystem an installation gets, at a fraction of the size, instead of an ordinary directory.
      - name: Start the Applications PostgreSQL test cluster
        run: |
          sudo bash scripts/mount-application-cluster-storage.sh install "$RUNNER_TEMP/conexus-apps.img" 1024 "$RUNNER_TEMP/conexus-apps"
          printf '%s' s6-ci-test-only > "$RUNNER_TEMP/conexus-apps-password"
          bash scripts/run-application-cluster.sh conexus-ci-apps 5434 "$RUNNER_TEMP/conexus-apps" "$RUNNER_TEMP/conexus-apps-password"
          for attempt in $(seq 1 60); do docker exec conexus-ci-apps pg_isready -U postgres -h 127.0.0.1 && break; sleep 1; done
          docker exec conexus-ci-apps pg_isready -U postgres -h 127.0.0.1
      # Project roles log in only with the application runner's certificate. The test cluster gets the
      # TLS files and pg_hba rules an installation gets; the Project role suites prove them.
      - name: Confine application roles on the test Applications cluster
        run: node scripts/confine-application-cluster.mjs --container conexus-ci-apps --authority-dir "$RUNNER_TEMP/conexus-app-authority" --tls-dir "$RUNNER_TEMP/conexus-app-tls" --database '/^conexus_apps_[0-9a-f]{12}$'
      # On a pull request the review-area check reads the base's map, and on a push both values are
      # empty and it checks the whole tree only.
      - run: npm run verify
        env:
          CONEXUS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONEXUS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONEXUS_TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
          CONEXUS_TEST_APP_TLS_DIR: ${{ runner.temp }}/conexus-app-tls
          CONEXUS_TEST_APP_DB_HOST: 127.0.0.1
          CONEXUS_TEST_APP_DB_PORT: '5434'
          CONEXUS_TEST_APP_DB_USER: postgres
          CONEXUS_TEST_APP_DB_PASSWORD: s6-ci-test-only
      - run: git diff --check
      # A guard that fails without naming what it found costs a whole CI cycle to diagnose.
      - name: The working tree is unchanged by verification
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "verification left the working tree dirty:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
