openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/2024-11-10
info:
  title: Conexus Technical Ingress Protocol API
  version: 4b-candidate
  description: >-
    Externally reachable protocol-only HTTP surfaces required by current F1 consumers.
    This description is not Product authority and has zero impact on N_platform.
servers:
  - url: /
    description: Relative technical-protocol root; deployment origin remains outside 4B.
security: []
x-conexus-surface: TECHNICAL_INGRESS
x-conexus-product-operation-count-impact: 0
x-conexus-authority-law:
  productAuthority: NONE
  protocolIdentityNeverGrantsProductAuthority: true
  internalMechanicsRemainInternal: true
paths:
  /protocol/oidc/login:
    get:
      summary: Begin OIDC login protocol
      operationId: BeginOidcLoginProtocol
      x-conexus-technical-id: TI-01
      x-conexus-surface: TECHNICAL_INGRESS
      x-conexus-protocol-state: PROTOCOL_CLOSED
      x-conexus-oidc-flow: AUTHORIZATION_CODE_PKCE_S256
      description: >-
        Begins the exact server-configured Keycloak OIDC Authorization Code + PKCE S256 flow.
        Conexus creates the authorization transaction, state and PKCE verifier server-side;
        the caller cannot select issuer, realm, client, redirect URI or authorization scope.
        An application host starts its own sign-in with its address label and the digest of a
        binding its browser holds, both or neither; the callback then returns there with a
        one-use handoff instead of a Conexus Hub session.
      security: []
      parameters:
        - name: application
          in: query
          required: false
          description: Address label of the application whose host started this sign-in. Never authority.
          schema:
            type: string
            pattern: '^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$'
        - name: binding
          in: query
          required: false
          description: Base64url SHA-256 of the sign-in binding the application host set in the browser.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '302':
          description: Redirect to the exact server-configured Keycloak authorization endpoint.
          headers:
            Location:
              description: Server-derived OIDC authorization URL for the configured Keycloak client.
              schema:
                type: string
                minLength: 1
        '503':
          description: The configured identity-provider dependency is unavailable or unusable.

  /protocol/oidc/callback:
    get:
      summary: Complete OIDC callback protocol
      operationId: CompleteOidcCallbackProtocol
      x-conexus-technical-id: TI-02
      x-conexus-surface: TECHNICAL_INGRESS
      x-conexus-protocol-state: PROTOCOL_CLOSED
      description: >-
        Handles the successful allowlisted OIDC authorization callback. The server validates the
        authorization transaction/state, exchanges and validates the code through the configured
        confidential OIDC client, resolves verified issuer+subject to a Conexus Account, and issues
        a new Conexus-owned opaque session. Provider tokens/claims never become Product authorization.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Opaque OIDC authorization code; never Product authority and never returned to Product clients.
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          description: Opaque server-issued authorization-transaction correlation value; never Product authority.
          schema:
            type: string
            minLength: 1
      responses:
        '303':
          description: Conexus session established; redirect to the server-derived post-login Conexus location.
          headers:
            Location:
              description: Server-derived same-origin Conexus location after successful authentication.
              schema:
                type: string
                minLength: 1
            Set-Cookie:
              description: >-
                Conexus-owned opaque session cookie. The value is server-owned and must use
                __Host-conexus_session with Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain.
              schema:
                type: string
                minLength: 1
        '400':
          description: Invalid, stale, mismatched or otherwise inadmissible OIDC callback transaction.
        '503':
          description: Required Keycloak/OIDC provider dependency is unavailable.
