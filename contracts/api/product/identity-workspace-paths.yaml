openapi: 3.1.2
info:
  title: Conexus Product API Identity and Workspace Path Items
  version: 4b-candidate
paths:
  /api/control/access-context:
    get:
      summary: GetControlPlaneAccessContext
      operationId: GetControlPlaneAccessContext
      x-conexus-4a-id: IAM-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Control Plane access context resolved from server-owned authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, workspaces, projects]
                properties:
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  workspaces:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [workspaceId, name]
                      properties:
                        workspaceId: { type: string, minLength: 1 }
                        name:
                          type: string
                          minLength: 1
                          pattern: '.*\S.*'
                          description: Human-readable Workspace identity; presentation-only and never authorization.
                  projects:
                    type: array
                    items:
                      $ref: './project-paths.yaml#/components/schemas/ProjectSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'

  /api/session:
    delete:
      summary: EndSession
      operationId: EndSession
      x-conexus-4a-id: IAM-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204':
          description: Current opaque Conexus session ended. This does not claim global Keycloak SSO logout.
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'

  /api/control/accounts:
    post:
      summary: ProvisionAccount
      operationId: ProvisionAccount
      x-conexus-4a-id: IAM-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-authority-routes: [trusted_provisioning_context]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapProvisionAccountRequest'
      responses:
        '201':
          description: Conexus Account provisioned or the same admitted intake resolved to its already-created Account; Account presentation is returned without exposing provider authorization state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListWorkspaceMembers
      operationId: ListWorkspaceMembers
      x-conexus-4a-id: IAM-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current Workspace roster. Members and pending invitations are one server-resolved projection, and the caller's own role is stated so the browser can hide controls the server would refuse anyway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoster'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      summary: InviteWorkspaceMember
      operationId: InviteWorkspaceMember
      x-conexus-4a-id: IAM-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 3
                  description: Verified-email address the invited person must sign in with. It is the natural key of the invitation and never Account identity or authorization.
                role:
                  $ref: '#/components/schemas/WorkspaceRole'
      responses:
        '200':
          description: Current invitation for this exact Workspace and email. The pair is the natural key, so repeating the same request answers the same invitation rather than creating a second one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationEntry'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }

  /api/control/workspaces/{workspaceId}/roster/{entryKind}/{entryId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: entryKind
        in: path
        required: true
        description: Which kind of roster entry this request withdraws.
        schema:
          type: string
          enum: [member, invitation]
      - name: entryId
        in: path
        required: true
        description: Untrusted reference to the exact roster entry; containment and authority are resolved server-side.
        schema: { type: string, minLength: 1 }
    delete:
      summary: RemoveWorkspaceRosterEntry
      operationId: RemoveWorkspaceRosterEntry
      x-conexus-4a-id: IAM-06
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: The roster entry is gone. Removing a member withdraws every right that derived from that membership row. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces/{workspaceId}/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: SetWorkspaceMemberRole
      operationId: SetWorkspaceMemberRole
      x-conexus-4a-id: IAM-10
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/WorkspaceRole'
      responses:
        '204': { description: The member now holds this role. Setting the same role again is the same answer. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces:
    post:
      summary: CreateWorkspace
      operationId: CreateWorkspace
      x-conexus-4a-id: WS-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Required human-readable Workspace identity fixed at F1 creation; not a grant, unique key, or rename authority.
      responses:
        '201':
          description: Workspace created from the admitted trusted-operator intake with its human-readable identity and exact initial current-Account access established; success never leaves an undisclosable orphan Workspace.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workspaceId, name, creatorAccountId, initialAccessEstablished]
                properties:
                  workspaceId: { type: string, minLength: 1 }
                  name:
                    type: string
                    minLength: 1
                    pattern: '.*\S.*'
                  creatorAccountId:
                    type: string
                    minLength: 1
                    description: Exact current Conexus Account for which initial Workspace access was established; never caller-selected authorization.
                  initialAccessEstablished:
                    type: boolean
                    const: true
                    description: Owner success fact that the creator can enter the new Workspace; not a generic role/grant payload.
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: GetWorkspace
      operationId: GetWorkspace
      x-conexus-4a-id: WS-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Workspace stable identity plus human-readable presentation identity.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workspaceId, name]
                properties:
                  workspaceId: { type: string, minLength: 1 }
                  name:
                    type: string
                    minLength: 1
                    pattern: '.*\S.*'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Untrusted Workspace reference only; current containment, disclosure and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
    AccountId:
      name: accountId
      in: path
      required: true
      description: Untrusted Account reference only; current identity, containment, disclosure and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
  schemas:
    WorkspaceRole:
      type: string
      enum: [owner, member]
      description: The whole of what a membership row confers. An owner may also administer the roster; a member may not.
    WorkspaceInvitationEntry:
      type: object
      additionalProperties: false
      required: [kind, invitationId, email, role, invitedAt, expiresAt]
      properties:
        kind: { const: invitation }
        invitationId: { type: string, minLength: 1 }
        email:
          type: string
          format: email
          description: Address the invited person must sign in with, verified by the identity provider. It is never Account identity or authorization.
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    WorkspaceMemberEntry:
      type: object
      additionalProperties: false
      required: [kind, accountId, displayName, role, since]
      properties:
        kind: { const: member }
        accountId: { type: string, minLength: 1 }
        displayName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: I&A-owned human presentation; never authentication or authorization.
        email:
          type: string
          format: email
          description: Optional presentation/contact data; never Account identity or authorization.
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        since: { type: string, format: date-time }
    WorkspaceRoster:
      type: object
      additionalProperties: false
      required: [viewerRole, entries]
      properties:
        viewerRole:
          $ref: '#/components/schemas/WorkspaceRole'
        entries:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/WorkspaceMemberEntry'
              - $ref: '#/components/schemas/WorkspaceInvitationEntry'
    BootstrapProvisionAccountRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      description: One-shot self-provisioning intake. The external subject is resolved from the exact trusted provisioning context and is never accepted from browser input, and an invited Account's email comes from the verified provider claim rather than from this body.
      properties:
        displayName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Required Conexus-owned human presentation for the exact provisioning subject.
        email:
          type: string
          format: email
          description: Optional human presentation/contact value; never Account identity or authorization.
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, displayName]
      properties:
        accountId:
          type: string
          minLength: 1
          description: Stable Conexus Account identity; presentation values never replace this identity.
        displayName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: I&A-owned human presentation; never authentication or authorization.
        email:
          type: string
          format: email
          description: Optional presentation/contact data; never Account identity or authorization.