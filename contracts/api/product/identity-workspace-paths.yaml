openapi: 3.1.2
info:
  title: Conexus Product API Identity and Workspace Path Items
  version: 4b-candidate
paths:
  /api/control/access-context:
    get:
      summary: GetControlPlaneAccessContext
      operationId: GetControlPlaneAccessContext
      x-conexus-4a-id: IAM-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Control Plane access context resolved from server-owned authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, workspaces, projects]
                properties:
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  workspaces:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [workspaceId, name]
                      properties:
                        workspaceId: { type: string, minLength: 1 }
                        name:
                          type: string
                          minLength: 1
                          pattern: '.*\S.*'
                          description: Human-readable Workspace identity; presentation-only and never authorization.
                  projects:
                    type: array
                    items:
                      $ref: './project-paths.yaml#/components/schemas/ProjectSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'

  /api/session:
    delete:
      summary: EndSession
      operationId: EndSession
      x-conexus-4a-id: IAM-02
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204':
          description: Current opaque Conexus session ended from either admitted human surface. This does not claim global Keycloak SSO logout.
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'

  /api/control/accounts:
    post:
      summary: ProvisionAccount
      operationId: ProvisionAccount
      x-conexus-4a-id: IAM-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-authority-routes: [platform_operator, trusted_bootstrap_context]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ProvisionAccountRequest'
                - $ref: '#/components/schemas/BootstrapProvisionAccountRequest'
      responses:
        '201':
          description: Conexus Account provisioned or the same admitted intake resolved to its already-created Account; Account presentation is returned without exposing provider authorization state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListWorkspaceMembers
      operationId: ListWorkspaceMembers
      x-conexus-4a-id: IAM-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Workspace members with bounded human presentation from I&A; labels never confer authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/membership-candidates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListWorkspaceMembershipCandidates
      operationId: ListWorkspaceMembershipCandidates
      x-conexus-4a-id: IAM-18
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: query
          in: query
          required: false
          description: Optional human lookup text over server-owned Account presentation. It is never Account identity or authorization input.
          schema:
            type: string
            minLength: 1
        - name: pageToken
          in: query
          required: false
          description: Opaque continuation for the same currently admitted candidate-disclosure query.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Existing Accounts currently disclosable as membership candidates for this exact Workspace access-administration context; inclusion is server-resolved and does not itself establish membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryPage'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/workspaces/{workspaceId}/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: AddWorkspaceMember
      operationId: AddWorkspaceMember
      x-conexus-4a-id: IAM-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Workspace membership established. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
    delete:
      summary: RemoveWorkspaceMember
      operationId: RemoveWorkspaceMember
      x-conexus-4a-id: IAM-06
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Workspace membership removed. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces/{workspaceId}/members/{accountId}/access:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      summary: GetWorkspaceMemberAccess
      operationId: GetWorkspaceMemberAccess
      x-conexus-4a-id: IAM-19
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact current Workspace-member access projection. I&A derives effective Project access and preserves every contributing DIRECT/AREA source; the caller/browser never computes authorization from local joins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberAccess'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/account-grants/{accountId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted reference only; current containment and authority are resolved server-side.
        schema: { type: string, minLength: 1 }
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: GrantAccountProjectAccess
      operationId: GrantAccountProjectAccess
      x-conexus-4a-id: IAM-07
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Direct Account Project access established. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
    delete:
      summary: RevokeAccountProjectAccess
      operationId: RevokeAccountProjectAccess
      x-conexus-4a-id: IAM-08
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Direct Account Project access removed. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces/{workspaceId}/areas/{areaId}/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AreaId'
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: AddAreaMember
      operationId: AddAreaMember
      x-conexus-4a-id: IAM-09
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Area membership established. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
    delete:
      summary: RemoveAreaMember
      operationId: RemoveAreaMember
      x-conexus-4a-id: IAM-10
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Area membership removed. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces/{workspaceId}/areas/{areaId}/access:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AreaId'
    get:
      summary: GetAreaAccess
      operationId: GetAreaAccess
      x-conexus-4a-id: IAM-20
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact current Area access projection containing human member summaries and currently granted Project summaries; it grants no Project content authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaAccess'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/area-grants/{areaId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted reference only; current containment and authority are resolved server-side.
        schema: { type: string, minLength: 1 }
      - $ref: '#/components/parameters/AreaId'
    put:
      summary: GrantAreaProjectAccess
      operationId: GrantAreaProjectAccess
      x-conexus-4a-id: IAM-11
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Area-derived Project access established. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
    delete:
      summary: RevokeAreaProjectAccess
      operationId: RevokeAreaProjectAccess
      x-conexus-4a-id: IAM-12
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '204': { description: Area-derived Project access removed. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/apps/{projectId}/access-context:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted reference only; current Published-App containment and authority are resolved server-side.
        schema: { type: string, minLength: 1 }
    get:
      summary: GetPublishedAppAccessContext
      operationId: GetPublishedAppAccessContext
      x-conexus-4a-id: IAM-13
      x-conexus-ingress: [PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current exact Published-App access and active Release context.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, projectId, activeReleaseId, role]
                properties:
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  projectId: { type: string, minLength: 1 }
                  activeReleaseId: { type: string, minLength: 1 }
                  role: { enum: [admin, member] }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/app-access:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted reference only; current Project/app administration scope is resolved server-side.
        schema: { type: string, minLength: 1 }
    get:
      summary: ListPublishedAppAccess
      operationId: ListPublishedAppAccess
      x-conexus-4a-id: IAM-14
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current Published-App access grants for the exact Project.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, roleOptions]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [account, role]
                      properties:
                        account:
                          $ref: '#/components/schemas/AccountSummary'
                        role: { enum: [admin, member] }
                  roleOptions:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      $ref: '#/components/schemas/PublishedAppRoleOption'
                    description: >-
                      Exact admin/member decision truth composed server-side from the current active Release.
                      This presentation is not a role engine and grants no capability.
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/app-access-candidates:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted reference only; current Project/app candidate-disclosure scope is resolved server-side.
        schema: { type: string, minLength: 1 }
    get:
      summary: ListPublishedAppAccessCandidates
      operationId: ListPublishedAppAccessCandidates
      x-conexus-4a-id: IAM-21
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: query
          in: query
          required: false
          description: Optional human lookup text over I&A-owned existing Conexus Account presentation; never a Keycloak-directory query, Account identity or authorization input.
          schema:
            type: string
            minLength: 1
        - name: pageToken
          in: query
          required: false
          description: Opaque continuation for the same currently admitted app-access candidate-disclosure query.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: >-
            Existing Conexus Accounts currently disclosable and not already granted for this exact Project/app.
            Inclusion grants nothing and absence never proves whether a Keycloak provider identity exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryPage'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/app-access/{accountId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted reference only; current Project/app administration scope is resolved server-side.
        schema: { type: string, minLength: 1 }
      - $ref: '#/components/parameters/AccountId'
    put:
      summary: SetPublishedAppAccess
      operationId: SetPublishedAppAccess
      x-conexus-4a-id: IAM-15
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: CURRENT_OR_ABSENT
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, expectedCurrent]
              properties:
                role:
                  enum: [admin, member]
                expectedCurrent:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [state]
                      properties:
                        state: { const: ABSENT }
                    - type: object
                      additionalProperties: false
                      required: [state, role]
                      properties:
                        state: { const: PRESENT }
                        role: { enum: [admin, member] }
      responses:
        '200':
          description: Current Published-App access grant after the admitted set/change.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projectId, account, role]
                properties:
                  projectId: { type: string, minLength: 1 }
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  role: { enum: [admin, member] }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '412': { $ref: './openapi.yaml#/components/responses/Problem412' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
    delete:
      summary: RevokePublishedAppAccess
      operationId: RevokePublishedAppAccess
      x-conexus-4a-id: IAM-17
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: EXPLICIT_CURRENT_SUBJECT
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: expectedRole
          in: query
          required: true
          description: Exact current Published-App role expected for the grant being narrowed; it is a stale-subject guard, not authority.
          schema:
            enum: [admin, member]
      responses:
        '204': { description: Published-App access grant revoked. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '412': { $ref: './openapi.yaml#/components/responses/Problem412' }

  /api/control/workspaces:
    post:
      summary: CreateWorkspace
      operationId: CreateWorkspace
      x-conexus-4a-id: WS-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Required human-readable Workspace identity fixed at F1 creation; not a grant, unique key, or rename authority.
      responses:
        '201':
          description: Workspace created from the admitted trusted-operator intake with its human-readable identity and exact initial current-Account access established; success never leaves an undisclosable orphan Workspace.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workspaceId, name, creatorAccountId, initialAccessEstablished]
                properties:
                  workspaceId: { type: string, minLength: 1 }
                  name:
                    type: string
                    minLength: 1
                    pattern: '.*\S.*'
                  creatorAccountId:
                    type: string
                    minLength: 1
                    description: Exact current Conexus Account for which initial Workspace access was established; never caller-selected authorization.
                  initialAccessEstablished:
                    type: boolean
                    const: true
                    description: Owner success fact that the creator can enter the new Workspace; not a generic role/grant payload.
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

  /api/control/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: GetWorkspace
      operationId: GetWorkspace
      x-conexus-4a-id: WS-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current disclosable Workspace stable identity plus human-readable presentation identity.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workspaceId, name]
                properties:
                  workspaceId: { type: string, minLength: 1 }
                  name:
                    type: string
                    minLength: 1
                    pattern: '.*\S.*'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/workspaces/{workspaceId}/areas:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListAreas
      operationId: ListAreas
      x-conexus-4a-id: WS-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      x-conexus-authority-routes: [workspace.manage, workspace.access.manage]
      responses:
        '200':
          description: Current disclosable Area summaries in the exact Workspace. Under workspace.access.manage this is access-administration summary disclosure only and grants no Workspace structure mutation authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AreaSummary'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
    post:
      summary: CreateArea
      operationId: CreateArea
      x-conexus-4a-id: WS-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Required human-readable Area identity fixed at F1 creation; not a grant, unique key, or rename authority.
      responses:
        '201':
          description: Area created within the exact Workspace with human presentation identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaSummary'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Untrusted Workspace reference only; current containment, disclosure and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
    AccountId:
      name: accountId
      in: path
      required: true
      description: Untrusted Account reference only; current identity, containment, disclosure and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
    AreaId:
      name: areaId
      in: path
      required: true
      description: Untrusted Area reference only; current Workspace containment, disclosure and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
  schemas:
    ProvisionAccountRequest:
      type: object
      additionalProperties: false
      required: [externalSubject, displayName]
      properties:
        externalSubject:
          type: string
          minLength: 1
          description: Stable subject from the single server-pinned configured authentication issuer; an ordinary trusted platform operator may identify the exact subject but cannot select issuer/provider authority.
        displayName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Required Conexus-owned human presentation for this Account; never authentication identity or authorization.
        email:
          type: string
          format: email
          description: Optional human presentation/contact value; never Account identity or authorization.
    BootstrapProvisionAccountRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      description: One-shot self-provisioning intake. externalSubject is resolved from the exact trusted bootstrap context and is never accepted from browser input.
      properties:
        displayName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Required Conexus-owned human presentation for the exact bootstrap subject.
        email:
          type: string
          format: email
          description: Optional human presentation/contact value; never Account identity or authorization.
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, displayName]
      properties:
        accountId:
          type: string
          minLength: 1
          description: Stable Conexus Account identity; presentation values never replace this identity.
        displayName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: I&A-owned human presentation; never authentication or authorization.
        email:
          type: string
          format: email
          description: Optional presentation/contact data; never Account identity or authorization.
    AccountSummaryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        nextPageToken:
          type: string
          minLength: 1
          description: Opaque continuation for the same admitted Account-candidate query.
    PublishedAppCapabilitySummary:
      type: object
      additionalProperties: false
      required: [operationId, name, purpose, regime]
      properties:
        operationId:
          type: string
          minLength: 1
          description: Exact operation identity from the current active Release; presentation never grants invocation.
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human capability name from the exact active Release semantic contract.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable capability purpose from the exact active Release semantic contract.
        regime:
          type: string
          enum: [QUERY, ACTION, INTEGRATION]
    PublishedAppRoleOption:
      type: object
      additionalProperties: false
      required: [role, capabilities]
      properties:
        role:
          enum: [admin, member]
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/PublishedAppCapabilitySummary'
          description: Complete exact active-Release capability subset admitted for this app role; empty is truthful.
    AreaSummary:
      type: object
      additionalProperties: false
      required: [areaId, name]
      properties:
        areaId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable Area identity; presentation-only and never authorization.
    DirectAccessSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { const: DIRECT }
    AreaAccessSource:
      type: object
      additionalProperties: false
      required: [kind, area]
      properties:
        kind: { const: AREA }
        area:
          $ref: '#/components/schemas/AreaSummary'
    EffectiveProjectAccess:
      type: object
      additionalProperties: false
      required: [project, sources]
      properties:
        project:
          $ref: './project-paths.yaml#/components/schemas/ProjectSummary'
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            oneOf:
              - $ref: '#/components/schemas/DirectAccessSource'
              - $ref: '#/components/schemas/AreaAccessSource'
          description: Complete I&A-derived set of current access sources. Multiple sources are preserved rather than collapsed.
    WorkspaceMemberAccess:
      type: object
      additionalProperties: false
      required: [account, areas, directProjects, effectiveProjects]
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaSummary'
        directProjects:
          type: array
          items:
            $ref: './project-paths.yaml#/components/schemas/ProjectSummary'
        effectiveProjects:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveProjectAccess'
          description: Current effective access derived by I&A from current direct and Area grant facts; browser-local recomputation is not authority.
    AreaAccess:
      type: object
      additionalProperties: false
      required: [area, members, projects]
      properties:
        area:
          $ref: '#/components/schemas/AreaSummary'
        members:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        projects:
          type: array
          items:
            $ref: './project-paths.yaml#/components/schemas/ProjectSummary'
          description: Current Projects granted through this exact Area; summaries grant no Project content authority.
