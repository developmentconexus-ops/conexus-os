openapi: 3.1.2
paths:
  /api/control/me/model-connections:
    get:
      operationId: ListModelConnections
      summary: List model connections available to the current Account.
      x-conexus-4a-id: CLA-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Safe connection metadata only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connections, accountSignIns, apiKeyProviders]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelConnection'
                  accountSignIns:
                    description: The account sign-ins Conexus built, each named as the person knows it.
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [providerId, name]
                      properties:
                        providerId: { type: string, minLength: 1, maxLength: 128 }
                        name: { type: string, minLength: 1 }
                  apiKeyProviders:
                    description: Every provider the model router knows, sorted by name. A key may be filed under any of them.
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [providerId, name, docUrl]
                      properties:
                        providerId: { type: string, minLength: 1, maxLength: 128 }
                        name: { type: string, minLength: 1 }
                        docUrl: { type: [string, 'null'], format: uri }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
  /api/control/me/model-connections/authorization:
    post:
      operationId: StartModelAuthorization
      summary: Start the named provider's authorization flow.
      x-conexus-4a-id: CLA-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId]
              properties:
                providerId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: Provider authorization URL and opaque transaction metadata.
          content:
            application/json:
              schema:
                type: object
                required: [authorizationId, url, state]
                properties:
                  authorizationId: { type: string, format: uuid }
                  url: { type: string, format: uri }
                  state: { type: string }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
  /api/control/me/model-connections/authorization/complete:
    post:
      operationId: CompleteModelAuthorization
      summary: Complete the named provider's authorization with its pasted result.
      x-conexus-4a-id: CLA-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId, result, label]
              properties:
                providerId: { type: string, minLength: 1, maxLength: 128 }
                result: { type: string, minLength: 3, maxLength: 8192 }
                label: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Newly connected safe metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
  /api/control/me/model-connections/api-key:
    post:
      operationId: AddModelConnectionApiKey
      summary: Add a model connection from an API key for a provider the model router knows.
      x-conexus-4a-id: CLA-08
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId, label, apiKey]
              properties:
                providerId: { type: string, minLength: 1, maxLength: 128 }
                label: { type: string, minLength: 1, maxLength: 120 }
                apiKey: { type: string, minLength: 8, maxLength: 4096 }
      responses:
        '201':
          description: Safe connection metadata. The key is written to custody and never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
  /api/control/me/model-connections/select:
    post:
      operationId: SelectModelConnection
      summary: Select a model connection for future BuilderRuns, one per provider.
      x-conexus-4a-id: CLA-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connectionId]
              properties:
                connectionId: { type: string, format: uuid }
      responses:
        '204': { description: Selection updated. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
  /api/control/me/model-connections/share:
    post:
      operationId: ShareModelConnection
      summary: Share a model connection into a Workspace the current Account belongs to.
      x-conexus-4a-id: CLA-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connectionId, workspaceId]
              properties:
                connectionId: { type: string, format: uuid }
                workspaceId: { type: string, format: uuid }
      responses:
        '204': { description: Connection shared. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
  /api/control/me/model-connections/unshare:
    post:
      operationId: UnshareModelConnection
      summary: Withdraw a model connection share from a Workspace.
      x-conexus-4a-id: CLA-07
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connectionId, workspaceId]
              properties:
                connectionId: { type: string, format: uuid }
                workspaceId: { type: string, format: uuid }
      responses:
        '204': { description: Connection share withdrawn. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
  /api/control/me/model-connections/{connectionId}/revoke:
    post:
      operationId: RevokeModelConnection
      summary: Revoke a model connection owned by the current Account.
      x-conexus-4a-id: CLA-06
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Connection revoked. }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
components:
  schemas:
    ModelConnection:
      type: object
      additionalProperties: false
      required: [connectionId, label, state, generation, ownerAccountId, workspaceId, role, revokedAt, providerId, credentialKind, selected]
      properties:
        connectionId: { type: string, format: uuid }
        providerId: { type: string }
        credentialKind: { type: string, enum: [OAUTH_TOKEN_SET, API_KEY] }
        label: { type: string }
        state: { type: string, enum: [ACTIVE, REVOKED] }
        generation: { type: string }
        ownerAccountId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, USER] }
        revokedAt: { type: [string, 'null'], format: date-time }
        selected:
          description: True when this connection is the Account's current preference for its provider.
          type: boolean
