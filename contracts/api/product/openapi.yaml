openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/2024-11-10
info:
  title: Conexus Product API
  version: 4b-candidate
  description: >-
    Canonical machine-readable HTTP wire for accepted Conexus Product operations.
    Product semantics remain owned by accepted 4A authority; this description may
    not invent operations, permissions, owners, or trust boundaries.
servers:
  - url: /
    description: Relative Product API root; deployment origin remains outside 4B.
security:
  - ConexusSession: []
x-conexus-security-semantics:
  keycloak: authentication-provider-only
  productAuthority: server-resolved-current-owner-facts
  nonHttpIngress: []
x-conexus-browser-request-authenticity:
  credentialedCrossOriginProductApi: DENY
  fetchMetadata: SAME_ORIGIN_ONLY
  fallback: EXACT_ORIGIN_OR_REFERER
paths:
  /api/control/access-context:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1access-context'
  /api/session:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1session'
  /api/control/accounts:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1accounts'
  /api/control/workspaces:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1workspaces'
  /api/control/workspaces/{workspaceId}:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1workspaces~1{workspaceId}'
  /api/control/workspaces/{workspaceId}/members:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1workspaces~1{workspaceId}~1members'
  /api/control/workspaces/{workspaceId}/members/{accountId}:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1workspaces~1{workspaceId}~1members~1{accountId}'
  /api/control/workspaces/{workspaceId}/invitations:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1workspaces~1{workspaceId}~1invitations'
  /api/control/workspaces/{workspaceId}/roster/{entryKind}/{entryId}:
    $ref: './identity-workspace-paths.yaml#/paths/~1api~1control~1workspaces~1{workspaceId}~1roster~1{entryKind}~1{entryId}'
  /api/control/workspaces/{workspaceId}/projects:
    $ref: './project-paths.yaml#/paths/~1api~1control~1workspaces~1{workspaceId}~1projects'
  /api/control/projects/{projectId}:
    $ref: './project-paths.yaml#/paths/~1api~1control~1projects~1{projectId}'
  /api/control/projects/{projectId}/source/tree:
    $ref: './builder-paths.yaml#/paths/~1api~1control~1projects~1{projectId}~1source~1tree'
  /api/control/projects/{projectId}/source/file:
    $ref: './builder-paths.yaml#/paths/~1api~1control~1projects~1{projectId}~1source~1file'
  /api/control/projects/{projectId}/builder-session:
    $ref: './builder-paths.yaml#/paths/~1api~1control~1projects~1{projectId}~1builder-session'
  /api/control/projects/{projectId}/builder-session/messages:
    $ref: './builder-paths.yaml#/paths/~1api~1control~1projects~1{projectId}~1builder-session~1messages'
  /api/control/projects/{projectId}/builder-session/runs/{builderRunId}/cancel:
    $ref: './builder-paths.yaml#/paths/~1api~1control~1projects~1{projectId}~1builder-session~1runs~1{builderRunId}~1cancel'
  /api/control/projects/{projectId}/builder-session/runs/{builderRunId}/trace:
    $ref: './builder-paths.yaml#/paths/~1api~1control~1projects~1{projectId}~1builder-session~1runs~1{builderRunId}~1trace'
  /api/control/me/claude-connections:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections'
  /api/control/me/claude-connections/authorization:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections~1authorization'
  /api/control/me/claude-connections/authorization/complete:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections~1authorization~1complete'
  /api/control/me/claude-connections/select:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections~1select'
  /api/control/me/claude-connections/share:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections~1share'
  /api/control/me/claude-connections/unshare:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections~1unshare'
  /api/control/me/claude-connections/{connectionId}/revoke:
    $ref: './claude-account-paths.yaml#/paths/~1api~1control~1me~1claude-connections~1{connectionId}~1revoke'
components:
  securitySchemes:
    ConexusSession:
      type: apiKey
      in: cookie
      name: __Host-conexus_session
      description: >-
        Opaque server-owned Conexus iam.session carriage. Keycloak tokens, roles,
        groups, and organizations are not accepted as Product authorization.
        The server-issued cookie MUST be Secure, HttpOnly, SameSite=Lax, Path=/,
        and MUST NOT include a Domain attribute.
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details base envelope.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable machine-readable problem type identifier.
        title:
          type: string
          description: Short human-readable summary for the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code for this occurrence.
        detail:
          type: string
          description: Human-readable occurrence detail; never a machine branching contract.
        instance:
          type: string
          format: uri-reference
          description: Identifier for this specific problem occurrence when disclosed.
      additionalProperties: true
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Strong current-representation precondition when the exact operation maps
        an accepted IC2 obligation to HTTP representation state.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Conexus-owned repeatable-intake identity for operations whose accepted
        IC3/IC4 wire mapping requires a caller-supplied retry identity. The header
        value never replaces owner/effect identity or authorizes replay of an
        unresolved external effect.
      schema:
        type: string
        minLength: 1
  headers:
    ETag:
      description: Strong representation validator where an accepted current-state contract requires it.
      schema:
        type: string
        minLength: 1
  responses:
    Problem401:
      description: No valid current Conexus principal/session for the protected human surface.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: Subject is legitimately disclosable to the current caller, but required action authority is denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: Subject is absent or current disclosure policy intentionally does not reveal its existence.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Current owner-state, uniqueness, single-flight, or equivalent admitted conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: Expected revision, generation, digest, or current representation precondition is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: Authorized request violates the operation's admitted semantic or business-input contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: Required current provider, source, or runtime dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
