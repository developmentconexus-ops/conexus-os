          description: Exact declared Data resource with human presentation, semantic kind/source, grain/freshness/coverage/provenance and logical fields/relationships/rules; physical topology, credentials and storage internals are excluded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDataResource'
        '401':
