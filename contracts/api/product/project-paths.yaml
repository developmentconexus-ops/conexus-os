                  minLength: 1
                connectionRevisionId:
                  type: string
                  minLength: 1
                environment:
                  type: string
                  minLength: 1
                expectedCurrent:
                  $ref: '#/components/schemas/ExpectedConnectionBindingState'
      responses:
        '200':
          description: Exact qualified compatible Connection revision bound for the stated Project environment after current-state comparison; response includes server-composed human Connection presentation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConnectionBinding'
        '401':
