components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
    CandidateBaselineDigest:
      name: candidateBaselineDigest
      in: path
      required: true
      description: Untrusted exact candidate Baseline digest reference only; current Project containment/disclosure is resolved server-side.
      schema:
        type: string
        minLength: 1
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
    DataResourceId:
      name: dataResourceId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
    AgentId:
      name: agentId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
  schemas:
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [projectId, workspaceId, name, archived]
      properties:
        projectId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable Project identity; not a stable identifier, uniqueness guarantee, or authorization source.
        archived:
          type: boolean
    ProjectRepresentation:
      type: object
      additionalProperties: false
      required: [projectId, workspaceId, name, projectRevision, archived]
      properties:
        projectId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable Project identity fixed for F1 after creation; rename is not admitted by this schema.
        projectRevision:
          type: string
          minLength: 1
        archived:
          type: boolean
    ProjectSourceBootstrap:
      description: Creation-time establishment of exactly one canonical Project Git source; mechanism/provider credentials remain server-side and post-create source switching is not admitted.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              const: NEW
        - type: object
          additionalProperties: false
          required: [mode, repositoryLocator]
          properties:
            mode:
              type: string
              const: EXISTING_GIT
            repositoryLocator:
              type: string
              minLength: 1
              pattern: '.*\S.*'
              description: Untrusted provider-neutral Git repository locator only. It carries no credential/secret and grants no generic fetch, network, Workspace or Project authority; server-side GitInfra/policy validates admission.
    ApprovedBaseline:
      type: object
      additionalProperties: false
      required: [baselineDigest, sourceRevision, sourceText, applicationRuntimeProfile]
      properties:
        baselineDigest:
          type: string
          minLength: 1
        sourceRevision:
          type: string
          minLength: 1
        sourceText:
          type: string
          minLength: 1
        applicationRuntimeProfile:
          type: string
          enum: [MANAGED, DEDICATED]
    ProjectBaselineCandidate:
      type: object
      additionalProperties: false
      required: [candidateBaselineDigest, sourceRevision, sourceText, applicationRuntimeProfile]
      properties:
        candidateBaselineDigest:
          type: string
          minLength: 1
        sourceRevision:
          type: string
          minLength: 1
        sourceText:
          type: string
          minLength: 1
        applicationRuntimeProfile:
          type: string
          enum: [MANAGED, DEDICATED]
    BaselineReviewContext:
      type: object
      additionalProperties: false
      required: [projectionAnchor]
      properties:
        projectionAnchor:
          type: string
          minLength: 1
          description: Untrusted deterministic candidate-local review-projection anchor. The server must re-resolve it against the exact candidate; it is never Product identity or authority.
        selectedText:
          type: string
          minLength: 1
          description: Optional selected rendered text used only as revalidated review context; HTML/DOM state never becomes Baseline truth.
    BaselineCandidateContextualAnswer:
      type: object
      additionalProperties: false
      required: [candidateBaselineDigest, answer, provenanceRefs]
      properties:
        candidateBaselineDigest:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1
        provenanceRefs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    ProjectBrainBinding:
      type: object
      additionalProperties: false
      required: [brainRevisionId, brainDigest, projectBindingDigest, validationState, updateAvailable]
      properties:
        brainRevisionId:
          type: string
          minLength: 1
        brainDigest:
          type: string
          minLength: 1
        projectBindingDigest:
          type: string
          minLength: 1
        validationState:
          type: string
          minLength: 1
          description: Owner-issued binding/conformance state; 4B does not invent a new global lifecycle enum.
        updateAvailable:
          type: boolean
    ProjectConnectionBinding:
      type: object
      additionalProperties: false
      required: [connectionId, connectionRevisionId, environment, connectionName]
      properties:
        connectionId:
          type: string
          minLength: 1
        connectionRevisionId:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        connectionName:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Server-composed human presentation of the referenced logical Connection for this disclosed binding; never binding identity, routing or authorization.
    ExpectedConnectionBindingState:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              const: ABSENT
        - type: object
          additionalProperties: false
          required: [state, connectionRevisionId, environment]
          properties:
            state:
              type: string
              const: PRESENT
            connectionRevisionId:
              type: string
              minLength: 1
            environment:
              type: string
              minLength: 1
    ProjectCapabilitySummary:
      type: object
      additionalProperties: false
      required: [capabilityId, name, purpose, operationId, regime]
      properties:
        capabilityId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human capability name from the exact authored/Release semantic contract; never routing or invocation authority.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable semantic purpose from the exact authored/Release contract; inspection only.
        operationId:
          type: string
          minLength: 1
        regime:
          type: string
          enum: [QUERY, ACTION, INTEGRATION]
    ProjectCapabilityField:
      type: object
      additionalProperties: false
      required: [name, type, required, description]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Logical human-readable field type from the admitted semantic contract; not a runtime serializer or arbitrary schema language.
        required:
          type: boolean
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    ProjectCapability:
      type: object
      additionalProperties: false
      required: [capabilityId, name, purpose, operationId, regime, inputs, outputs]
      properties:
        capabilityId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human capability name from the exact authored/Release semantic contract; never routing or invocation authority.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable semantic purpose from the exact authored/Release contract; inspection only.
        operationId:
          type: string
          minLength: 1
        regime:
          type: string
          enum: [QUERY, ACTION, INTEGRATION]
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCapabilityField'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCapabilityField'
    ProjectModelPolicySamplingLimits:
      type: object
      additionalProperties: false
      properties:
        maxOutputTokens:
          type: integer
          minimum: 1
        temperatureMinimum:
          type: number
          minimum: 0
          maximum: 2
        temperatureMaximum:
          type: number
          minimum: 0
          maximum: 2
        topPMinimum:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        topPMaximum:
          type: number
          exclusiveMinimum: 0
          maximum: 1
      description: Project-owned authored sampling envelope; never provider passthrough or runtime override authority.
    ProjectModelPolicySummary:
      type: object
      additionalProperties: false
      required: [policyRef, label, purpose, isDefault]
      properties:
        policyRef:
          type: string
          minLength: 1
          description: Exact Project/Release-governed model-policy reference; possession grants no model invocation or mutation authority.
        label:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Project-owned human presentation; no structured provider/model identity is implied.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable reason and intended use of this governed policy.
        isDefault:
          type: boolean
          description: Server-issued default for this exact Project; the browser never elects or persists a parallel default.
        samplingLimits:
          $ref: '#/components/schemas/ProjectModelPolicySamplingLimits'
    ProjectDataResourceSummary:
      type: object
      additionalProperties: false
      required: [dataResourceId, name, resourceKind, sourceKind]
      properties:
        dataResourceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Server-owned human presentation identity of the declared Project Data resource; never routing, authorization, containment or uniqueness authority.
        resourceKind:
          type: string
          enum: [TABLE, VIEW, DATASET]
          description: Semantic human resource kind only; TABLE does not expose physical database topology.
        sourceKind:
          type: string
          enum: [INTERNAL, INTEGRATION, DERIVED]
          description: Human source category for Project-owned, external-integration-backed or derived data; not an owner/authorization coordinate.
    ProjectDataField:
      type: object
      additionalProperties: false
      required: [fieldId, name, type, required, description]
      properties:
        fieldId:
          type: string
          minLength: 1
          description: Stable resource-scoped semantic field coordinate; never a physical column/storage identifier by implication.
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        type:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Logical human-readable field type; not physical DDL authority.
        required:
          type: boolean
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    ProjectDataRelationship:
      type: object
      additionalProperties: false
      required: [relationshipId, sourceFieldId, targetDataResourceId, targetFieldId, description]
      properties:
        relationshipId:
          type: string
          minLength: 1
        sourceFieldId:
          type: string
          minLength: 1
        targetDataResourceId:
          type: string
          minLength: 1
        targetFieldId:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human semantic relationship meaning; not a physical join expression or foreign-key DDL projection.
    ProjectDataRule:
      type: object
      additionalProperties: false
      required: [ruleId, description]
      properties:
        ruleId:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human semantic/business rule for the Data resource; not SQL, DDL or executable expression authority.
    ProjectDataResource:
      type: object
      additionalProperties: false
      required: [dataResourceId, name, resourceKind, sourceKind, grain, freshness, coverage, provenance, fields, relationships, rules]
      properties:
        dataResourceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Server-owned human presentation identity of the declared Project Data resource; never routing, authorization, containment or uniqueness authority.
        resourceKind:
          type: string
          enum: [TABLE, VIEW, DATASET]
          description: Semantic human resource kind only; TABLE does not expose physical database topology.
        sourceKind:
          type: string
          enum: [INTERNAL, INTEGRATION, DERIVED]
          description: Human source category only; not authorization or physical storage topology.
        grain:
          type: string
          minLength: 1
        freshness:
          type: string
          minLength: 1
        coverage:
          type: string
          minLength: 1
        provenance:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDataField'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDataRelationship'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDataRule'
    ProjectProductAgent:
      type: object
      additionalProperties: false
      required: [agentId, name, purpose, authoredRevisionId, releaseRefs, activeReleaseId]
      properties:
        agentId:
          type: string
          minLength: 1
          description: Stable Product Agent machine identity; never human presentation or authorization by itself.
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human Product Agent presentation identity from the exact authored agent/v1 revision; never routing, authorization or runtime state.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable semantic purpose from the exact authored agent/v1 revision; never authorization or runtime health.
        authoredRevisionId:
          type: string
          minLength: 1
        releaseRefs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        activeReleaseId:
          type: [string, 'null']
          minLength: 1
          description: Current Project Release coordinate when this Agent is included in the active Release; presence does not prove runtime health, execution or served verification.
    ProductAgentModelPolicy:
      type: object
      additionalProperties: false
      required: [policyRef]
      properties:
        policyRef:
          type: string
          minLength: 1
          description: Exact Project/Release-governed model-policy reference; never a provider credential or runtime model override.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Optional authored sampling preference admitted by the selected policy; server validation may reject an unsupported value.
        topP:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: Optional authored sampling preference admitted by the selected policy; not a provider passthrough object.
        maxOutputTokens:
          type: integer
          minimum: 1
          description: Optional authored output bound admitted by the selected policy.
    ProductAgentToolBinding:
      type: object
      additionalProperties: false
      required: [capabilityId, purpose]
      properties:
        capabilityId:
          type: string
          minLength: 1
          description: Exact governed Project capability reference; not a Mastra/provider tool identifier and not invocation authority by possession.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable bounded reason this Agent may use the capability.
    ProductAgentBrainContext:
      type: object
      additionalProperties: false
      required: [mode, contextRefs]
      properties:
        mode:
          type: string
          enum: [PROJECT_BOUND]
          description: The runtime context is resolved from the exact Project/Release; the browser cannot compose an effective Brain slice.
        contextRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
          description: Project-context authoring references only; not Workspace publication or runtime ToolProjection coordinates.
    ProductAgentMemoryPolicy:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [NONE, CONVERSATION_HISTORY]
          description: Only currently admitted memory modes; working, observational, semantic-recall and extractor memory remain deferred.
    ProductAgentDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, purpose, instructions, modelPolicy, tools, brainContext, memory, interactions, policyRefs, approvalPolicyRefs, budgetPolicyRefs, verificationRefs, knownLimitations]
      properties:
        schemaVersion:
          type: string
          const: agent/v1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human presentation identity authored in the exact definition; never routing or authorization authority.
        purpose:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable semantic purpose authored in the exact definition.
        instructions:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Canonical authored Agent instructions; framework-specific system-prompt storage is mechanism, not Product authority.
        modelPolicy: { $ref: '#/components/schemas/ProductAgentModelPolicy' }
        tools:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProductAgentToolBinding' }
        brainContext: { $ref: '#/components/schemas/ProductAgentBrainContext' }
        memory: { $ref: '#/components/schemas/ProductAgentMemoryPolicy' }
        interactions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [CONVERSATION, SCHEDULE] }
          description: Currently admitted interactive/headless modes; EVENT remains deferred.
        policyRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        approvalPolicyRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        budgetPolicyRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        verificationRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        knownLimitations:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, pattern: '.*\S.*' }
    ProjectProductAgentDetail:
      type: object
      additionalProperties: false
      required: [agentId, authoredRevisionId, releaseRefs, activeReleaseId, definition]
      properties:
        agentId:
          type: string
          minLength: 1
          description: Stable Product Agent identity; current Project containment and disclosure are revalidated server-side.
        authoredRevisionId: { type: string, minLength: 1 }
        releaseRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        activeReleaseId:
          type: [string, 'null']
          minLength: 1
        definition: { $ref: '#/components/schemas/ProductAgentDefinition' }
    WorkspaceProductAgentCatalogItem:
      type: object
      additionalProperties: false
      required: [agent, project]
      properties:
        agent:
          $ref: '#/components/schemas/ProjectProductAgent'
        project:
          $ref: '#/components/schemas/ProjectSummary'
