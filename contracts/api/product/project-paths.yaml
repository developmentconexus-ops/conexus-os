openapi: 3.1.2
info:
  title: Conexus Product API Project Path Items
  version: 4b-candidate
paths:
  /api/control/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListProjects
      operationId: ListProjects
      x-conexus-4a-id: PRJ-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      x-conexus-authority-routes: [project.read, workspace.access.manage]
      responses:
        '200':
          description: Projects currently disclosable to the caller in the Workspace. The normal project.read route follows ordinary Project disclosure; the workspace.access.manage route is access-administration summary disclosure only and returns exact contained ProjectSummary identities without granting Project content/source/data/build authority.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
    post:
      summary: CreateProject
      operationId: CreateProject
      x-conexus-4a-id: PRJ-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, sourceBootstrap]
              properties:
                name:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Required human-readable Project identity fixed at F1 creation; not a grant, unique key, or rename authority.
                sourceBootstrap:
                  $ref: '#/components/schemas/ProjectSourceBootstrap'
      responses:
        '201':
          description: Source-complete Project established in the exact Workspace with the admitted initial operator grant, human-readable identity and exactly one canonical Project Git source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepresentation'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

  /api/control/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetProject
      operationId: GetProject
      x-conexus-4a-id: PRJ-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact current disclosable Project identity and owner state without sibling data-plane facts. While an installation administrator's deletion of this Project is recorded but unfinished, this stays disclosable to that administrator alone, with deleting true, so a reload after a crash still shows the retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
    delete:
      summary: DeleteProject
      operationId: DeleteProject
      x-conexus-4a-id: PRJ-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      description: Installation-administrator only. The caller must repeat the Project's exact current name to confirm; every Hub row naming the Project, its Mastra Factory state, its application's preview data and its GitHub repository are torn down together. A 503 means the request is durably recorded and safe to repeat unchanged; the Project stays gone from every disclosure meanwhile.
      parameters:
        - name: confirmName
          in: query
          required: true
          description: Must equal the Project's exact current name; any other value refuses the request unchanged.
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: The Project, its data and its GitHub repository are gone.
        '400':
          $ref: './openapi.yaml#/components/responses/Problem400'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
  schemas:
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [projectId, workspaceId, name, archived]
      properties:
        projectId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable Project identity; not a stable identifier, uniqueness guarantee, or authorization source.
        archived:
          type: boolean
    ProjectRepresentation:
      type: object
      additionalProperties: false
      required: [projectId, workspaceId, name, projectRevision, archived]
      properties:
        projectId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable Project identity fixed for F1 after creation; rename is not admitted by this schema.
        projectRevision:
          type: string
          minLength: 1
        archived:
          type: boolean
    ProjectDetail:
      type: object
      additionalProperties: false
      required: [projectId, workspaceId, name, projectRevision, archived, deleting]
      properties:
        projectId:
          type: string
          minLength: 1
        workspaceId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Human-readable Project identity fixed for F1 after creation; rename is not admitted by this schema.
        projectRevision:
          type: string
          description: Empty once an installation administrator's deletion has purged the underlying record; deleting is true whenever this happens.
        archived:
          type: boolean
        deleting:
          type: boolean
          description: True while an installation administrator's deletion of this Project has been recorded but not finished. Every other property may already reflect a purged database record kept disclosable only by the deletion tombstone.
    ProjectSourceBootstrap:
      description: Creation-time establishment of exactly one canonical Project Git source; mechanism/provider credentials remain server-side and post-create source switching is not admitted.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              const: NEW
        - type: object
          additionalProperties: false
          required: [mode, repositoryLocator]
          properties:
            mode:
              type: string
              const: EXISTING_GIT
            repositoryLocator:
              type: string
              minLength: 1
              pattern: '.*\S.*'
              description: Untrusted provider-neutral Git repository locator only. It carries no credential/secret and grants no generic fetch, network, Workspace or Project authority; server-side GitInfra/policy validates admission.
