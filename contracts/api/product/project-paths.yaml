    get:
      summary: ListProjectProductAgents
      operationId: ListProjectProductAgents
      x-conexus-4a-id: PRJ-20
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Authored Product Agent human identity, semantic purpose, exact authored revision and Release projection. Ordinary disclosure requires project.source.read; an exact-Project, purpose-bound agent.trigger.manage route exposes this same summary only for trigger administration. It grants no PRJ-21 authored detail, source content or Agent mutation. PAR runtime authority is excluded.
          content:
            application/json:
              schema:
                type: array
                items:
