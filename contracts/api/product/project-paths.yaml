      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Access-filtered Workspace catalog projection over Project-owned Product Agents. Each item is self-contained for human recognition through the canonical Agent projection plus its owning ProjectSummary; catalog disclosure creates no Workspace Agent/fleet authority or Project source-read grant.
          content:
            application/json:
              schema:
                type: array
