openapi: 3.1.2
info:
  title: Conexus Product API Project Path Items
  version: 4b-candidate
paths:
  /api/control/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListProjects
      operationId: ListProjects
      x-conexus-4a-id: PRJ-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      x-conexus-authority-routes: [project.read, workspace.access.manage]
      responses:
        '200':
          description: Projects currently disclosable to the caller in the Workspace. The normal project.read route follows ordinary Project disclosure; the workspace.access.manage route is access-administration summary disclosure only and returns exact contained ProjectSummary identities without granting Project content/source/data/build authority.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
    post:
      summary: CreateProject
      operationId: CreateProject
      x-conexus-4a-id: PRJ-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, sourceBootstrap]
              properties:
                name:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Required human-readable Project identity fixed at F1 creation; not a grant, unique key, or rename authority.
                sourceBootstrap:
                  $ref: '#/components/schemas/ProjectSourceBootstrap'
      responses:
        '201':
          description: Source-complete Project established in the exact Workspace with the admitted initial operator grant, human-readable identity and exactly one canonical Project Git source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepresentation'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

  /api/control/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetProject
      operationId: GetProject
      x-conexus-4a-id: PRJ-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact current disclosable Project identity and owner state without sibling data-plane facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepresentation'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/projects/{projectId}/commands/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: ArchiveProject
      operationId: ArchiveProject
      x-conexus-4a-id: PRJ-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: EXPLICIT_CURRENT_SUBJECT
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedProjectRevision]
              properties:
                expectedProjectRevision:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Project archived without destructive deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepresentation'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '412':
          $ref: './openapi.yaml#/components/responses/Problem412'

  /api/control/projects/{projectId}/commands/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: DuplicateProject
      operationId: DuplicateProject
      x-conexus-4a-id: PRJ-06
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destinationWorkspaceId, name]
              properties:
                destinationWorkspaceId:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Required human-readable identity of the destination Project; the source Project name is never copied implicitly as Product authority.
      responses:
        '201':
          description: Duplicated Project created with the accepted NO DATA copy policy; destination establishes its own current human identity, bindings and authorization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project, businessDataPolicy]
                properties:
                  project:
                    $ref: '#/components/schemas/ProjectRepresentation'
                  businessDataPolicy:
                    type: string
                    const: NO_DATA
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/projects/{projectId}/inception-investigations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: RunInceptionInvestigation
      operationId: RunInceptionInvestigation
      x-conexus-4a-id: PRJ-07
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Human business intent for this Inception investigation, including objective/users/constraints as needed; not generic mutable Project metadata and not source-selection authority.
                priorCandidateBaselineDigest:
                  type: string
                  minLength: 1
                  description: Exact immutable prior Baseline candidate being refined. It is an untrusted reference that must resolve inside the current Project and never becomes browser/model authority.
                reviewFeedback:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Explicit human review feedback about the exact prior candidate; it is input to a new governed investigation and never mutates the prior candidate in place.
              dependentRequired:
                priorCandidateBaselineDigest: [reviewFeedback]
                reviewFeedback: [priorCandidateBaselineDigest]
      responses:
        '200':
          description: Governed investigation completed over the Project's already-admitted source/context and produced one exact immutable candidate Baseline. When refinement fields are present, the new candidate is explicitly derived from the exact prior candidate plus human review feedback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBaselineCandidate'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

  /api/control/projects/{projectId}/baseline:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetApprovedProjectBaseline
      operationId: GetApprovedProjectBaseline
      x-conexus-4a-id: PRJ-08
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact currently approved Project Baseline pinned to its source revision and digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedBaseline'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/projects/{projectId}/baseline/decisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: ApproveProjectBaselineRevision
      operationId: ApproveProjectBaselineRevision
      x-conexus-4a-id: PRJ-09
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: EXPLICIT_REVISION
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateBaselineDigest]
              properties:
                candidateBaselineDigest:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Exact candidate Baseline digest accepted as the current approved Project Baseline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedBaseline'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '412':
          $ref: './openapi.yaml#/components/responses/Problem412'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/projects/{projectId}/baseline-candidates/{candidateBaselineDigest}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CandidateBaselineDigest'
    get:
      summary: GetProjectBaselineCandidate
      operationId: GetProjectBaselineCandidate
      x-conexus-4a-id: PRJ-23
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact immutable Project Baseline candidate identified by the caller-known candidate digest for human review/re-entry before approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBaselineCandidate'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/projects/{projectId}/baseline-candidates/{candidateBaselineDigest}/assistant/queries:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CandidateBaselineDigest'
    post:
      summary: AskConexusAboutBaselineCandidate
      operationId: AskConexusAboutBaselineCandidate
      x-conexus-4a-id: PRJ-24
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Human question about the exact immutable candidate Baseline; the question itself grants no additional Project or Builder authority.
                reviewContext:
                  $ref: '#/components/schemas/BaselineReviewContext'
      responses:
        '200':
          description: Contextual explanation about the exact immutable candidate Baseline with provenance; no Baseline mutation, approval, grant or Builder authority is implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineCandidateContextualAnswer'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/projects/{projectId}/brain-binding:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetProjectBrainBinding
      operationId: GetProjectBrainBinding
      x-conexus-4a-id: PRJ-10
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact current Project Brain binding and current conformance/update projection.
          headers:
            ETag:
              $ref: './openapi.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBrainBinding'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
    put:
      summary: SetProjectBrainBinding
      operationId: SetProjectBrainBinding
      x-conexus-4a-id: PRJ-11
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: CURRENT_OR_ABSENT
      x-conexus-contract-state: SCHEMA_CLOSED
      x-conexus-precondition-one-of: [If-Match, If-None-Match]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Strong current binding representation validator for a present-state replacement. Exactly one of If-Match or If-None-Match must be supplied.
          schema:
            type: string
            minLength: 1
        - name: If-None-Match
          in: header
          required: false
          description: Exact absent-state precondition for initial binding establishment. Exactly one of If-Match or If-None-Match must be supplied.
          schema:
            type: string
            const: '*'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [brainRevisionId]
              properties:
                brainRevisionId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Existing exact Project Brain binding replaced after current-state and conformance checks.
          headers:
            ETag:
              $ref: './openapi.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBrainBinding'
        '201':
          description: Exact Project Brain binding established from an absent state after conformance checks.
          headers:
            ETag:
              $ref: './openapi.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBrainBinding'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '412':
          $ref: './openapi.yaml#/components/responses/Problem412'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'
    delete:
      summary: ClearProjectBrainBinding
      operationId: ClearProjectBrainBinding
      x-conexus-4a-id: PRJ-12
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IF_MATCH
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: Exact current Project Brain binding removed; Workspace Brain authority is unchanged.
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '412':
          $ref: './openapi.yaml#/components/responses/Problem412'

