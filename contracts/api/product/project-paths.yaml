      operationId: GetProjectProductAgent
      x-conexus-4a-id: PRJ-21
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact Project-owned Agent authored definition plus immutable authored-revision and Release coordinates. The definition is the safe complete agent/v1 authoring projection; runtime/provider/Mastra override identity remains excluded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProductAgentDetail'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
