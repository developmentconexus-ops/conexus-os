openapi: 3.1.2
info:
  title: Conexus Product API Builder Path Items
  version: 4b-candidate
paths:
  /api/control/projects/{projectId}/source/tree:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: ListProjectSourceTree
      operationId: ListProjectSourceTree
      x-conexus-4a-id: BLD-08
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: '#/components/parameters/SourceRevision'
      responses:
        '200':
          description: Read-only Project source tree for the exact requested source revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceTree' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/source/file:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetProjectSourceFile
      operationId: GetProjectSourceFile
      x-conexus-4a-id: BLD-09
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: '#/components/parameters/SourceRevision'
        - name: path
          in: query
          required: true
          description: Exact Project-Git source path under requested immutable source revision.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Read-only exact source-file content projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFile' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/builder-session:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetBuilderSession
      operationId: GetBuilderSession
      x-conexus-4a-id: BLD-23
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Persisted Mastra Project conversation with the latest BuilderRun and last-good Preview summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuilderSession' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/builder-session/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: SendBuilderMessage
      operationId: SendBuilderMessage
      x-conexus-4a-id: BLD-24
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendBuilderMessageRequest' }
      responses:
        '201':
          description: One BuilderRun admitted against the server-resolved current Project source and Mastra Thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuilderMessageAccepted' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
    SourceRevision:
      name: sourceRevision
      in: query
      required: true
      description: Exact immutable Project-Git source revision to read; never mutable latest/head authority.
      schema: { type: string, minLength: 1 }

  schemas:
    BuilderMessage:
      type: object
      additionalProperties: false
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, minLength: 1 }
        role: { type: string, enum: [user, assistant, system] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    BuilderRunSummary:
      type: object
      additionalProperties: false
      required: [builderRunId, projectId, state, mode, baseSourceRevision]
      properties:
        builderRunId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, INTERRUPTED] }
        mode: { type: string, enum: [BUILD, PLAN] }
        baseSourceRevision: { type: string, pattern: '^[0-9a-f]{40}$' }
        resultSourceRevision: { type: [string, 'null'], pattern: '^[0-9a-f]{40}$' }
        resultKind: { type: [string, 'null'], enum: [RESPONSE_ONLY, SOURCE_CHANGED, SOURCE_CHANGED_BUILD_FAILED, null] }
        failureCode: { type: [string, 'null'] }
    BuilderPreviewSummary:
      type: object
      additionalProperties: false
      required: [workingSourceRevision, lastGoodSourceRevision, lastGoodArtifactRevisionId, lastGoodArtifactDigest]
      properties:
        workingSourceRevision: { type: [string, 'null'], pattern: '^[0-9a-f]{40}$' }
        lastGoodSourceRevision: { type: [string, 'null'], pattern: '^[0-9a-f]{40}$' }
        lastGoodArtifactRevisionId: { type: [string, 'null'], format: uuid }
        lastGoodArtifactDigest: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    LatestCodeChangingBuilderRun:
      type: object
      additionalProperties: false
      required: [baseSourceRevision, resultSourceRevision, resultKind]
      properties:
        baseSourceRevision: { type: string, pattern: '^[0-9a-f]{40}$' }
        resultSourceRevision: { type: string, pattern: '^[0-9a-f]{40}$' }
        resultKind: { type: string, enum: [SOURCE_CHANGED, SOURCE_CHANGED_BUILD_FAILED] }
    OpenBuilderPreviewRequest:
      type: object
      additionalProperties: false
      required: []
    PreviewLaunch:
      type: object
      additionalProperties: false
      required: [entryUrl, previewUrl, entryGrant, artifactRevisionId, artifactDigest, expiresAt]
      properties:
        entryUrl: { type: string, format: uri }
        previewUrl: { type: string, format: uri }
        entryGrant: { type: string, minLength: 1 }
        artifactRevisionId: { type: string, format: uuid }
        artifactDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        expiresAt: { type: string, format: date-time }
    BuilderSession:
      type: object
      additionalProperties: false
      required: [projectId, messages, latestBuilderRun, latestCodeChangingRun, preview]
      properties:
        projectId: { type: string, format: uuid }
        messages:
          type: array
          items: { $ref: '#/components/schemas/BuilderMessage' }
        latestBuilderRun:
          oneOf:
            - $ref: '#/components/schemas/BuilderRunSummary'
            - type: 'null'
        latestCodeChangingRun:
          oneOf:
            - $ref: '#/components/schemas/LatestCodeChangingBuilderRun'
            - type: 'null'
        preview: { $ref: '#/components/schemas/BuilderPreviewSummary' }
        mode: { type: string, enum: [BUILD, PLAN] }
    SendBuilderMessageRequest:
      type: object
      additionalProperties: false
      required: [content, mode]
      properties:
        content: { type: string, minLength: 1, maxLength: 20000, pattern: '.*\S.*' }
        mode: { type: string, enum: [BUILD, PLAN] }
    BuilderMessageAccepted:
      type: object
      additionalProperties: false
      required: [builderRun]
      properties:
        builderRun: { $ref: '#/components/schemas/BuilderRunSummary' }
    SourceTreeEntry:
      type: object
      additionalProperties: false
      required: [path, kind]
      properties:
        path: { type: string, minLength: 1 }
        kind: { type: string, enum: [FILE, DIRECTORY] }
    SourceTree:
      type: object
      additionalProperties: false
      required: [sourceRevision, entries]
      properties:
        sourceRevision: { type: string, minLength: 1 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SourceTreeEntry' }
    SourceFile:
      type: object
      additionalProperties: false
      required: [sourceRevision, path, content]
      properties:
        sourceRevision: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        content: { type: string }
