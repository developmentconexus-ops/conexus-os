openapi: 3.1.2
info:
  title: Conexus Product API Builder Path Items
  version: 4b-candidate
paths:
  /api/control/projects/{projectId}/source/tree:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: ListProjectSourceTree
      operationId: ListProjectSourceTree
      x-conexus-4a-id: BLD-08
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: '#/components/parameters/SourceRevision'
      responses:
        '200':
          description: Read-only Project source tree for the exact requested source revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceTree' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/source/file:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetProjectSourceFile
      operationId: GetProjectSourceFile
      x-conexus-4a-id: BLD-09
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: '#/components/parameters/SourceRevision'
        - name: path
          in: query
          required: true
          description: Exact Project-Git source path under requested immutable source revision.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Read-only exact source-file content projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFile' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/source/compare:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: CompareProjectSourceRevisions
      operationId: CompareProjectSourceRevisions
      x-conexus-4a-id: BLD-29
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: baseSourceRevision
          in: query
          required: true
          description: Exact immutable Project-Git source revision the comparison starts from.
          schema: { type: string, pattern: '^[0-9a-f]{40}$' }
        - name: resultSourceRevision
          in: query
          required: true
          description: Exact immutable Project-Git source revision the comparison ends at.
          schema: { type: string, pattern: '^[0-9a-f]{40}$' }
      responses:
        '200':
          description: Changed paths between two admitted source revisions; file content is read separately via GetProjectSourceFile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceComparison' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/builder-session:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetBuilderSession
      operationId: GetBuilderSession
      x-conexus-4a-id: BLD-23
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Persisted Mastra Project conversation with the latest BuilderRun and last-good Preview summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuilderSession' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/control/projects/{projectId}/builder-session/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: SendBuilderMessage
      operationId: SendBuilderMessage
      x-conexus-4a-id: BLD-24
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendBuilderMessageRequest' }
      responses:
        '201':
          description: One BuilderRun admitted against the server-resolved current Project source and Mastra Thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuilderMessageAccepted' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }

  /api/control/projects/{projectId}/builder-session/runs/{builderRunId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: builderRunId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: CancelBuilderRun
      operationId: CancelBuilderRun
      x-conexus-4a-id: BLD-25
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '200':
          description: Idempotent authorized interruption request and current BuilderRun projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuilderMessageAccepted' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/control/projects/{projectId}/builder-session/runs/{builderRunId}/trace:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: builderRunId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: GetBuilderRunTrace
      operationId: GetBuilderRunTrace
      x-conexus-4a-id: BLD-26
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Authorized safe native trace projection for one BuilderRun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuilderTraceSummary' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/control/projects/{projectId}/conversations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: ListFactoryConversations
      operationId: ListFactoryConversations
      x-conexus-4a-id: BLD-27
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: The conversations of a Project developed through the Factory, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryConversationList' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
    post:
      summary: CreateFactoryConversation
      operationId: CreateFactoryConversation
      x-conexus-4a-id: BLD-28
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFactoryConversationRequest' }
      responses:
        '200':
          description: The conversation a previous request with the same client-chosen id already created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryConversationCreated' }
        '201':
          description: One new conversation of the Project, under the id the client chose.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryConversationCreated' }
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema: { type: string, minLength: 1 }
    SourceRevision:
      name: sourceRevision
      in: query
      required: true
      description: Exact immutable Project-Git source revision to read; never mutable latest/head authority.
      schema: { type: string, minLength: 1 }

  schemas:
    BuilderRunSummary:
      type: object
      additionalProperties: false
      required: [builderRunId, projectId, conversationId, state, mode, baseSourceRevision, requestText, createdAt, failureCategory, cancellationRequested]
      properties:
        builderRunId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        # The conversation this run spoke in. It is a Mastra thread id under the Project's
        # resourceId, not a Conexus record: the product keeps no conversation store of its own.
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        state: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, INTERRUPTED] }
        mode: { type: string, enum: [BUILD, PLAN] }
        baseSourceRevision: { type: string, pattern: '^[0-9a-f]{40}$' }
        resultSourceRevision: { type: [string, 'null'], pattern: '^[0-9a-f]{40}$' }
        resultKind: { type: [string, 'null'], enum: [RESPONSE_ONLY, SOURCE_CHANGED, SOURCE_CHANGED_BUILD_FAILED, null] }
        failureCode: { type: [string, 'null'] }
        # The public category the operator is shown. failureCode stays beside it as the handle the
        # Detalhes lens and an operator's diagnosis need, and carries only codes the category table
        # declares.
        failureCategory:
          type: [string, 'null']
          enum: [ENVIRONMENT_PREPARATION_FAILED, MODEL_CREDENTIAL_REFUSED, MODEL_RATE_LIMITED, MODEL_REQUEST_REFUSED, SOURCE_RESULT_REJECTED, SOURCE_BASE_MOVED, PREVIEW_NOT_BUILT, APPLICATION_BUILD_FAILED, RUN_CANCELLED, RUN_INTERRUPTED, INTERNAL_ERROR, null]
        requestText: { type: [string, 'null'], maxLength: 20000 }
        createdAt: { type: string, format: date-time }
        cancellationRequested: { type: boolean }
    BuilderPreviewSummary:
      type: object
      additionalProperties: false
      required: [workingSourceRevision, lastGoodSourceRevision, lastGoodArtifactRevisionId, lastGoodArtifactDigest]
      properties:
        workingSourceRevision: { type: [string, 'null'], pattern: '^[0-9a-f]{40}$' }
        lastGoodSourceRevision: { type: [string, 'null'], pattern: '^[0-9a-f]{40}$' }
        lastGoodArtifactRevisionId: { type: [string, 'null'], format: uuid }
        lastGoodArtifactDigest: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    LatestCodeChangingBuilderRun:
      type: object
      additionalProperties: false
      required: [baseSourceRevision, resultSourceRevision, resultKind]
      properties:
        baseSourceRevision: { type: string, pattern: '^[0-9a-f]{40}$' }
        resultSourceRevision: { type: string, pattern: '^[0-9a-f]{40}$' }
        resultKind: { type: string, enum: [SOURCE_CHANGED, SOURCE_CHANGED_BUILD_FAILED] }
    OpenBuilderPreviewRequest:
      type: object
      additionalProperties: false
      required: []
    PreviewLaunch:
      type: object
      additionalProperties: false
      required: [entryUrl, previewUrl, entryGrant, artifactRevisionId, artifactDigest, expiresAt]
      properties:
        entryUrl: { type: string, format: uri }
        previewUrl: { type: string, format: uri }
        entryGrant: { type: string, minLength: 1 }
        artifactRevisionId: { type: string, format: uuid }
        artifactDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        expiresAt: { type: string, format: date-time }
    BuilderSession:
      type: object
      additionalProperties: false
      required: [projectId, latestBuilderRun, latestCodeChangingRun, preview, runHistory]
      properties:
        projectId: { type: string, format: uuid }
        # The Project's conversations are its Mastra session's own threads, so the browser lists
        # them and their messages over the Agent Controller routes. Nothing about them is projected
        # here, and neither is the model, which is Mastra's own credential store and selection.
        latestBuilderRun:
          oneOf:
            - $ref: '#/components/schemas/BuilderRunSummary'
            - type: 'null'
        latestCodeChangingRun:
          oneOf:
            - $ref: '#/components/schemas/LatestCodeChangingBuilderRun'
            - type: 'null'
        preview: { $ref: '#/components/schemas/BuilderPreviewSummary' }
        mode: { type: string, enum: [BUILD, PLAN] }
        runHistory:
          type: array
          items: { $ref: '#/components/schemas/BuilderRunSummary' }
    FactoryConversation:
      type: object
      additionalProperties: false
      required: [conversationId, title, createdAt]
      properties:
        # The Factory session id, which is also the Mastra resourceId and thread id.
        conversationId: { type: string, format: uuid }
        title: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
    FactoryConversationList:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/FactoryConversation' }
    CreateFactoryConversationRequest:
      type: object
      additionalProperties: false
      required: [conversationId]
      properties:
        conversationId:
          description: Chosen by the client, so a retried request returns the conversation the first one created.
          type: string
          format: uuid
        title: { type: string, minLength: 1, maxLength: 200 }
    FactoryConversationCreated:
      type: object
      additionalProperties: false
      required: [conversation]
      properties:
        conversation: { $ref: '#/components/schemas/FactoryConversation' }
    EmptyRequest:
      type: object
      additionalProperties: false
      required: []
    BuilderTraceSpan:
      type: object
      additionalProperties: false
      required: [spanType, name, startedAt, durationMs, error]
      properties:
        spanType: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        startedAt: { type: string, format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        error: { type: boolean }
    BuilderTraceSummary:
      type: object
      additionalProperties: false
      required: [available, traceId, spans]
      properties:
        available: { type: boolean }
        traceId: { type: [string, 'null'], minLength: 1 }
        spans:
          type: array
          items: { $ref: '#/components/schemas/BuilderTraceSpan' }
    SendBuilderMessageRequest:
      type: object
      additionalProperties: false
      required: [content, mode, conversationId]
      properties:
        content: { type: string, minLength: 1, maxLength: 20000, pattern: '.*\S.*' }
        mode: { type: string, enum: [BUILD, PLAN] }
        conversationId:
          description: Which of the Project's conversations this message belongs to.
          type: string
          minLength: 1
          maxLength: 200
    BuilderMessageAccepted:
      type: object
      additionalProperties: false
      required: [builderRun]
      properties:
        builderRun: { $ref: '#/components/schemas/BuilderRunSummary' }
    SourceTreeEntry:
      type: object
      additionalProperties: false
      required: [path, kind]
      properties:
        path: { type: string, minLength: 1 }
        kind: { type: string, enum: [FILE, DIRECTORY] }
    SourceTree:
      type: object
      additionalProperties: false
      required: [sourceRevision, entries]
      properties:
        sourceRevision: { type: string, minLength: 1 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SourceTreeEntry' }
    SourceFile:
      type: object
      additionalProperties: false
      required: [sourceRevision, path, content]
      properties:
        sourceRevision: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        content: { type: string }
    SourceChange:
      type: object
      additionalProperties: false
      required: [path, status, previousPath]
      properties:
        path: { type: string, minLength: 1 }
        status: { type: string, enum: [ADDED, REMOVED, MODIFIED, RENAMED] }
        previousPath: { type: [string, 'null'], minLength: 1 }
    SourceComparison:
      type: object
      additionalProperties: false
      required: [baseSourceRevision, resultSourceRevision, files]
      properties:
        baseSourceRevision: { type: string, minLength: 1 }
        resultSourceRevision: { type: string, minLength: 1 }
        files:
          type: array
          items: { $ref: '#/components/schemas/SourceChange' }
