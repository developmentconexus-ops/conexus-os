        projectId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        releaseId:
          type: string
          minLength: 1
          description: Exact active Release pinned at AgentRun admission; caller did not select it.
    HeadlessAgentRunAdmission:
      type: object
      additionalProperties: false
      required: [agentRunId, projectId, agentId, releaseId]
      properties:
        agentRunId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        releaseId:
          type: string
          minLength: 1
          description: Exact active Release pinned at AgentRun admission; caller did not select it.
    ReleaseAgentInteractionInput:
      type: object
      additionalProperties: true
      x-conexus-schema-source: RELEASE_AGENT_INTERACTION
      description: Exact input object validated against the active Release-pinned Agent interaction contract. This is not an arbitrary framework/model configuration bag.
    ReleaseAgentOutput:
      type: object
      additionalProperties: true
      x-conexus-schema-source: RELEASE_AGENT_OUTPUT
      description: Exact Product Agent output projection under the admitted Release interaction contract; runtime/provider chunks remain subordinate mechanics.
    AgentRunProblem:
      type: object
      additionalProperties: false
      required: [summary]
      description: Safe PAR owner projection for human investigation. It contains no raw provider, model, tool or secret payload and grants no retry/resume authority.
      properties:
        summary:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
        detail:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
        remediation:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
    AgentRun:
      type: object
      additionalProperties: false
      required: [agentRunId, projectId, agentId, releaseId, origin, runState, admittedAt]
      properties:
        agentRunId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        releaseId:
          type: string
          minLength: 1
          description: Exact immutable Release pinned before model/tool execution.
        origin:
          type: string
          enum: [INTERACTIVE, HEADLESS, SCHEDULE]
        conversationId:
          type: string
          minLength: 1
          description: Present for interactive Conversation-origin runs.
        triggerId:
          type: string
          minLength: 1
          description: Present for schedule-origin runs.
        runState:
          type: string
          minLength: 1
          description: PAR owner-issued AgentRun lifecycle state. 4B does not invent a complete lifecycle enum merely for UI convenience.
        admittedAt:
          type: string
          format: date-time
          description: Owner-issued time at which this exact AgentRun was admitted.
        settledAt:
          type: string
          format: date-time
          description: Owner-issued terminal settlement time when the AgentRun has settled; absence means no terminal settlement is asserted.
        problem:
          $ref: '#/components/schemas/AgentRunProblem'
        output:
          $ref: '#/components/schemas/ReleaseAgentOutput'
        evidenceRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    AgentRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentRun' }
        nextPageToken: { type: string, minLength: 1 }
    SealedApprovalProposal:
      type: object
      additionalProperties: true
      x-conexus-schema-source: SEALED_APPROVAL_PROPOSAL
      description: Exact safe owner projection of the sealed proposal and arguments the human is being asked to decide. Changed proposal content requires new authority.
    ApprovalAgentSnapshot:
      type: object
      additionalProperties: false
      required: [agentId, name, purpose, releaseId]
      description: Immutable request-time human presentation for the exact Agent/Release context. It supports recognition only and is never current Agent, Release or authorization truth.
      properties:
        agentId: { type: string, minLength: 1 }
        name:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
        purpose:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
        releaseId: { type: string, minLength: 1 }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [approvalRequestId, projectId, agentRunId, agent, actionSummary, requestedAt, proposalRef, proposalDigest, approvalState, proposal]
      properties:
        approvalRequestId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
        agentRunId: { type: string, minLength: 1 }
        agent:
          $ref: '#/components/schemas/ApprovalAgentSnapshot'
        actionSummary:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
          description: Deterministic safe human summary of the proposed effect/consequence; it never replaces the exact sealed proposal or its digest.
        requestedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Present only when PAR defines an expiry for this exact request.
        proposalRef:
          type: string
          minLength: 1
          description: Stable owner proposal reference; Mastra toolCallId is correlation only and is not exposed as Product authority.
        proposalDigest:
          type: string
          minLength: 1
          description: Digest binding the exact sealed proposal shown to the human.
        approvalState:
          type: string
          minLength: 1
          description: PAR owner-issued state. ALLOW_ONCE/DENY are caller decisions; expiry/staleness remain owner outcomes.
        proposal:
          $ref: '#/components/schemas/SealedApprovalProposal'
    ApprovalRequestSummary:
      type: object
      additionalProperties: false
      required: [approvalRequestId, agentRunId, agent, actionSummary, requestedAt, proposalRef, proposalDigest, approvalState]
      properties:
        approvalRequestId: { type: string, minLength: 1 }
        agentRunId: { type: string, minLength: 1 }
        agent:
          $ref: '#/components/schemas/ApprovalAgentSnapshot'
        actionSummary:
          type: string
          minLength: 1
          pattern: '.*\\S.*'
          description: Deterministic safe human summary; exact decision truth remains PAR-09's sealed proposal.
        requestedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Present only when PAR defines an expiry for this exact request.
        proposalRef: { type: string, minLength: 1 }
        proposalDigest: { type: string, minLength: 1 }
        approvalState: { type: string, minLength: 1 }
    ApprovalRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApprovalRequestSummary' }
        nextPageToken: { type: string, minLength: 1 }
    ApprovalDecisionResult:
      type: object
      additionalProperties: false
      required: [approvalRequestId, agentRunId, decision, approvalState]
      properties:
        approvalRequestId: { type: string, minLength: 1 }
        agentRunId: { type: string, minLength: 1 }
        decision:
          type: string
          enum: [ALLOW_ONCE, DENY]
        approvalState:
          type: string
          minLength: 1
          description: Current PAR owner state after applying the decision; mechanical runtime continuation does not self-authorize an effect.
    ScheduleSpec:
      type: object
      additionalProperties: false
      required: [cron, timeZone]
      properties:
        cron:
          type: string
          minLength: 9
          pattern: '^\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+$'
          description: Bounded five-field cron expression. Seconds/year/nicknames/natural-language recurrence are not admitted into the F1 Product contract.
        timeZone:
          type: string
          minLength: 1
          description: IANA time-zone identifier. Exact runtime validation uses the selected standards/platform implementation in 4D.
    AgentTrigger:
      type: object
      additionalProperties: false
      required: [triggerId, projectId, agentId, triggerRevisionId, triggerKind, schedule, triggerState]
      properties:
        triggerId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        triggerRevisionId:
          type: string
          minLength: 1
          description: Exact current immutable TriggerRevision identity.
        triggerKind:
          type: string
          enum: [SCHEDULE]
        schedule:
          $ref: '#/components/schemas/ScheduleSpec'
        triggerState:
          type: string
          minLength: 1
          description: PAR owner-issued current trigger state; 4B does not import the scheduler provider lifecycle vocabulary.
    AgentTriggerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentTrigger' }
        nextPageToken: { type: string, minLength: 1 }
