openapi: 3.1.2
info:
  title: Conexus Product API Product Agent Runtime Path Items
  version: 4b-candidate
paths:
  /api/apps/{projectId}/agents/{agentId}/conversations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
    get:
      summary: ListConversations
      operationId: ListConversations
      x-conexus-4a-id: PAR-01
      x-conexus-ingress: [PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Current app-authorized recognizable Conversations for the exact Project/Agent, ordered by lastActivityAt DESC with stable conversationId DESC tie-breaker before pagination. Conversation existence never grants authority by itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }
    post:
      summary: CreateConversation
      operationId: CreateConversation
      x-conexus-4a-id: PAR-03
      x-conexus-ingress: [PUBLISHED_APP]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Empty Conexus Conversation created for the exact current app/Agent authority. The caller does not configure model, runtime, memory, Release or provider state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/apps/{projectId}/agents/{agentId}/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: GetConversation
      operationId: GetConversation
      x-conexus-4a-id: PAR-02
      x-conexus-ingress: [PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact Conexus Conversation and user-visible text history under current app/Agent disclosure. Provider thread/session identity remains private runtime mechanics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/apps/{projectId}/agents/{agentId}/conversations/{conversationId}/turns:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: SendProductAgentTurn
      operationId: SendProductAgentTurn
      x-conexus-4a-id: PAR-04
      x-conexus-ingress: [PUBLISHED_APP]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: Current human turn text. Caller-supplied full history, model/runtime configuration and Release overrides are forbidden.
                contextRefs:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/AppContextRef'
                  description: Optional typed app-context references. They are untrusted references validated against the exact active Release/Agent/app authority and never grant access by possession.
                replyToQuestionMessageId:
                  type: string
                  minLength: 1
                  description: Optional exact currently open QUESTION message being answered. Possession never proves that the question remains open or answerable.
                selectedOptionId:
                  type: string
                  minLength: 1
                  description: Optional exact bounded option from replyToQuestionMessageId. It is rejected without a current matching question/option and never replaces the human text.
      responses:
        '202':
          description: Exact PAR AgentRun admitted and Release-pinned. Acceptance does not mean execution completed, every effect succeeded, or any live stream is still connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveAgentRunAdmission'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/headless/projects/{projectId}/agents/{agentId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: RunProductAgentHeadless
      operationId: RunProductAgentHeadless
      x-conexus-4a-id: PAR-05
      x-conexus-ingress: [HEADLESS]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                input:
                  $ref: '#/components/schemas/ReleaseAgentInteractionInput'
      responses:
        '202':
          description: Exact headless AgentRun admitted under current explicit headless authority and active Release/Agent pins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadlessAgentRunAdmission'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/runtime/projects/{projectId}/agent-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: ListAgentRuns
      operationId: ListAgentRuns
      x-conexus-4a-id: PAR-06
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: agentId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: Optional exact Agent filter; never invocation authority.
        - name: conversationId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: Optional exact Conversation filter under current disclosure.
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Current disclosable PAR AgentRun owner facts, ordered by admittedAt DESC with stable agentRunId DESC tie-breaker before pagination. The identifier is only a tie-breaker and is never interpreted as time. Published-App access is limited to exact in-scope app authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunList'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/runtime/projects/{projectId}/agent-runs/{agentRunId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentRunId'
    get:
      summary: GetAgentRun
      operationId: GetAgentRun
      x-conexus-4a-id: PAR-07
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact PAR AgentRun owner truth and provenance. COMPLETED never means every external effect succeeded; Gateway receipts remain separate truth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/runtime/projects/{projectId}/approval-requests:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: ListApprovalRequests
      operationId: ListApprovalRequests
      x-conexus-4a-id: PAR-08
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: agentRunId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: Optional exact AgentRun filter. Queue visibility still requires current approver eligibility.
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Current actionable approval queue for the exact eligible human, including PAR-issued request-time Agent presentation, safe action summary and temporal context. audit.read alone never grants queue visibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestList'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/runtime/projects/{projectId}/approval-requests/{approvalRequestId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ApprovalRequestId'
    get:
      summary: GetApprovalRequest
      operationId: GetApprovalRequest
      x-conexus-4a-id: PAR-09
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact sealed approval subject for a current eligible approver or separately authorized read-only investigator. Surface/app role alone never grants eligibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }

  /api/runtime/projects/{projectId}/approval-requests/{approvalRequestId}/decisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      summary: DecideApprovalRequest
      operationId: DecideApprovalRequest
      x-conexus-4a-id: PAR-10
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-current-state-carrier: EXPLICIT_SEALED_SUBJECT
      x-conexus-effect-fence: OWNER_GATEWAY_IC4
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, expectedSubjectDigest]
              properties:
                decision:
                  type: string
                  enum: [ALLOW_ONCE, DENY]
                  description: Exact current human decision. EXPIRED/STALE are owner outcomes, never caller-selectable decisions.
                expectedSubjectDigest:
                  type: string
                  minLength: 1
                  description: Digest of the exact sealed subject the human was shown. Changed subject/current authority cannot win this decision.
      responses:
        '200':
          description: Approval owner decision recorded after current eligibility/revocation/Release/sealed-subject revalidation. Mechanical Mastra resume and Gateway effect admission remain subordinate mechanics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResult'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '412': { $ref: './openapi.yaml#/components/responses/Problem412' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/control/projects/{projectId}/agents/{agentId}/triggers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
    get:
      summary: ListAgentTriggers
      operationId: ListAgentTriggers
      x-conexus-4a-id: PAR-11
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: Exact Project/Agent trigger administration projection. F1 admits SCHEDULE only; scheduler storage/runtime identifiers remain private mechanics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTriggerList'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
    post:
      summary: CreateScheduleTrigger
      operationId: CreateScheduleTrigger
      x-conexus-4a-id: PAR-13
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schedule]
              properties:
                schedule:
                  $ref: '#/components/schemas/ScheduleSpec'
      responses:
        '201':
          description: New PAR-owned SCHEDULE TriggerRevision created without caller-supplied enabled/runtime/provider state. Enabling remains the separate PAR-15 decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }

  /api/control/projects/{projectId}/agents/{agentId}/triggers/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      summary: GetAgentTrigger
      operationId: GetAgentTrigger
      x-conexus-4a-id: PAR-12
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact current TriggerRevision/current state.
          headers:
            ETag:
              $ref: './openapi.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
    patch:
      summary: ReviseScheduleTrigger
      operationId: ReviseScheduleTrigger
      x-conexus-4a-id: PAR-14
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IF_MATCH
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schedule]
              properties:
                schedule:
                  $ref: '#/components/schemas/ScheduleSpec'
      responses:
        '200':
          description: New/current TriggerRevision after same-target conditional revision; enabled state is not caller-patched through this operation.
          headers:
            ETag:
              $ref: './openapi.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '412': { $ref: './openapi.yaml#/components/responses/Problem412' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }

  /api/control/projects/{projectId}/agents/{agentId}/triggers/{triggerId}/commands/enable:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      summary: EnableAgentTrigger
      operationId: EnableAgentTrigger
      x-conexus-4a-id: PAR-15
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: EXPLICIT_TRIGGER_REVISION
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTriggerRevisionId]
              properties:
                expectedTriggerRevisionId:
                  type: string
                  minLength: 1
                  description: Exact TriggerRevision being enabled; stale revisions cannot win the command-subresource decision.
      responses:
        '200':
          description: Trigger enabled only after current Project/Release/Agent/TriggerRevision authority revalidation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }
        '412': { $ref: './openapi.yaml#/components/responses/Problem412' }
        '422': { $ref: './openapi.yaml#/components/responses/Problem422' }
        '503': { $ref: './openapi.yaml#/components/responses/Problem503' }

  /api/control/projects/{projectId}/agents/{agentId}/triggers/{triggerId}/commands/disable:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      summary: DisableAgentTrigger
      operationId: DisableAgentTrigger
      x-conexus-4a-id: PAR-16
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: OWNER_CURRENT
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current Trigger disabled as an explicit narrowing action. Archived Project state must not block this narrowing command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTrigger'
        '401': { $ref: './openapi.yaml#/components/responses/Problem401' }
        '403': { $ref: './openapi.yaml#/components/responses/Problem403' }
        '404': { $ref: './openapi.yaml#/components/responses/Problem404' }
        '409': { $ref: './openapi.yaml#/components/responses/Problem409' }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Untrusted Project reference; current containment/disclosure/runtime authority are resolved server-side.
      schema: { type: string, minLength: 1 }
    AgentId:
      name: agentId
      in: path
      required: true
      description: Exact Product Agent identity under current Project/Release authority; caller possession grants no invocation authority.
      schema: { type: string, minLength: 1 }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Exact Conexus Conversation identity; not a provider thread/session identity and not authorization by existence.
      schema: { type: string, minLength: 1 }
    AgentRunId:
      name: agentRunId
      in: path
      required: true
      description: Exact PAR AgentRun owner identity; runtime/provider run IDs remain private correlation mechanics.
      schema: { type: string, minLength: 1 }
    ApprovalRequestId:
      name: approvalRequestId
      in: path
      required: true
      description: Exact PAR ApprovalRequest owner identity; path possession never grants approval eligibility.
      schema: { type: string, minLength: 1 }
    TriggerId:
      name: triggerId
      in: path
      required: true
      description: Exact PAR AgentTrigger identity; scheduler/provider identifiers remain private mechanics.
      schema: { type: string, minLength: 1 }
    PageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque continuation token for the same admitted list shape; never authorization or snapshot authority.
      schema: { type: string, minLength: 1 }
  schemas:
    AppContextRef:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          minLength: 1
          description: Exact app-context reference kind admitted by the active Release/Agent interaction contract; 4B does not invent a global context-type registry.
        ref:
          type: string
          minLength: 1
          description: Untrusted reference resolved and authorized server-side.
    ConversationResponseOption:
      type: object
      additionalProperties: false
      required: [optionId, label]
      properties:
        optionId:
          type: string
          minLength: 1
          description: Stable option identity within the exact QUESTION message; not business or authorization identity.
        label:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    ConversationMessage:
      type: object
      additionalProperties: false
      required: [messageId, role, kind, text, createdAt]
      properties:
        messageId: { type: string, minLength: 1 }
        role:
          type: string
          enum: [USER, AGENT]
        kind: { type: string, enum: [TEXT, QUESTION] }
        text:
          type: string
          description: User-visible durable conversation text. Runtime reasoning/tool/snapshot material is not automatically conversation content.
        createdAt: { type: string, format: date-time }
        responseOptions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConversationResponseOption'
          description: Bounded presentation choices only for an Agent QUESTION; absence permits an ordinary free-text reply.
        replyToQuestionMessageId:
          type: string
          minLength: 1
          description: Present on a USER reply when it answers an exact prior QUESTION message.
        selectedOptionId:
          type: string
          minLength: 1
          description: Present only when the USER chose one option from the referenced QUESTION; owner validation binds it to that message.
    Conversation:
      type: object
      additionalProperties: false
      required: [conversationId, projectId, agentId, startedAt, lastActivityAt, attention, messages]
      properties:
        conversationId: { type: string, minLength: 1 }
        projectId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        startedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        attention: { type: string, enum: [NONE, NEEDS_YOUR_RESPONSE] }
        pendingQuestionMessageId:
          type: string
          minLength: 1
          description: Present only while attention is NEEDS_YOUR_RESPONSE and identifies the exact current unanswered QUESTION.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [conversationId, projectId, agentId, startedAt, lastActivityAt, lastMessagePreview, attention]
      properties:
        conversationId: { type: string, minLength: 1 }
