        agentId: { type: string, minLength: 1 }
        startedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        lastMessagePreview:
          type: [string, 'null']
          maxLength: 240
          description: Owner-projected safe preview of the last user-visible message, or null for an empty Conversation; never model/runtime reasoning.
        attention: { type: string, enum: [NONE, NEEDS_YOUR_RESPONSE] }
        pendingQuestionMessageId:
          type: string
          minLength: 1
