openapi: 3.1.2
info:
  title: Conexus Product API Brain Path Items
  version: 4b-candidate
paths:
  /api/control/workspaces/{workspaceId}/brain:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: GetWorkspaceBrain
      operationId: GetWorkspaceBrain
      x-conexus-4a-id: BRN-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Canonical Workspace Brain publication projection; runtime memory, vector indexes and tool authority are not Brain Product authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBrain'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/brain/revisions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListBrainRevisions
      operationId: ListBrainRevisions
      x-conexus-4a-id: BRN-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: forProjectId
          in: query
          required: false
          description: Optional exact target Project context activating purpose-bound immutable revision selection for Project Brain binding. Server revalidates Project containment plus project.manage + brain.bind; omission uses ordinary brain.read disclosure. This route remains BrainRevision summary-only and grants no BRN-03, knowledgeBrowse, proposal, publication or Brain mutation authority.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Immutable published Brain revisions currently disclosable for the Workspace. With forProjectId, disclosure is purpose-bound to exact Project Brain-binding selection under project.manage + brain.bind and remains summary-only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrainRevision'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/brain/revisions/{brainRevisionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BrainRevisionId'
    get:
      summary: GetBrainRevision
      operationId: GetBrainRevision
      x-conexus-4a-id: BRN-03
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact immutable published Brain revision with deterministic source-bound human review text plus structured knowledge-browse projection. AVAILABLE does not mean any Project silently adopts it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainRevisionDetail'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/brain/discoveries:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      summary: StartBrainDiscovery
      operationId: StartBrainDiscovery
      x-conexus-4a-id: BRN-04
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId]
              properties:
                projectId:
                  type: string
                  minLength: 1
                  description: Project whose already-admitted source/Connection context is used for read-only discovery; it is an untrusted reference, not credential authority.
      responses:
        '200':
          description: Directed read-only discovery result containing hypotheses with provenance; unsupported semantic mappings remain hypotheses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainDiscoveryResult'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

  /api/control/workspaces/{workspaceId}/brain/proposals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: ListKnowledgeProposals
      operationId: ListKnowledgeProposals
      x-conexus-4a-id: BRN-05
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current KnowledgeProposal projections with provenance and owner-issued hypothesis/review state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeProposal'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
    post:
      summary: SubmitKnowledgeProposal
      operationId: SubmitKnowledgeProposal
      x-conexus-4a-id: BRN-07
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: IDEMPOTENCY_KEY
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - $ref: './openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SourceBackedKnowledgeProposalInput'
                - $ref: '#/components/schemas/DiscoveryBackedKnowledgeProposalInput'
      responses:
        '201':
          description: KnowledgeProposal submitted for human review. Source-backed intake preserves an existing Brain candidate revision; Discovery-backed intake revalidates the exact discovery candidate and explicit human resolution before Brain materializes the candidate source. Submission never self-publishes Brain authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeProposal'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/workspaces/{workspaceId}/brain/proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    get:
      summary: GetKnowledgeProposal
      operationId: GetKnowledgeProposal
      x-conexus-4a-id: BRN-06
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact KnowledgeProposal candidate/provenance with current Brain-owner review state and deterministic human-readable projection of the exact candidate source revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeProposal'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

  /api/control/workspaces/{workspaceId}/brain/proposals/{proposalId}/decisions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    post:
      summary: DecideKnowledgeProposal
      operationId: DecideKnowledgeProposal
      x-conexus-4a-id: BRN-08
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: EXPLICIT_CURRENT_SUBJECT
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedProposalRevision, decision]
              properties:
                expectedProposalRevision:
                  type: string
                  minLength: 1
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
      responses:
        '200':
          description: Human decision applied to the exact current proposal revision; machine confidence cannot replace review authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeProposal'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '412':
          $ref: './openapi.yaml#/components/responses/Problem412'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/workspaces/{workspaceId}/brain/publications:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      summary: PublishBrainRevision
      operationId: PublishBrainRevision
      x-conexus-4a-id: BRN-09
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: EXPLICIT_REVISION
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateSourceRevision]
              properties:
                candidateSourceRevision:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Human-reviewed candidate published as a new immutable AVAILABLE Brain revision; Projects remain explicitly pinned until separately rebound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainRevision'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '412':
          $ref: './openapi.yaml#/components/responses/Problem412'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/workspaces/{workspaceId}/brain/health:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: GetBrainHealth
      operationId: GetBrainHealth
      x-conexus-4a-id: BRN-10
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Operational health overlay for the exact Brain revision; the overlay cannot mutate immutable Brain content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainHealth'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

  /api/control/projects/{projectId}/analytic-query-catalog:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: GetProjectAnalyticQueryCatalog
      operationId: GetProjectAnalyticQueryCatalog
      x-conexus-4a-id: BRN-13
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Current Project-admitted semantic choices for BRN-12, derived from the exact current Project Brain binding and curated analytical admission; no SQL, physical topology or independent semantic authority is disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAnalyticQueryCatalog'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

  /api/projects/{projectId}/analytic-queries:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: RunAnalyticQuery
      operationId: RunAnalyticQuery
      x-conexus-4a-id: BRN-12
      x-conexus-ingress: [CONTROL_PLANE, PUBLISHED_APP]
      x-conexus-non-http-ingress: [PAR_TOOL]
      x-conexus-current-state-carrier: NONE
      x-conexus-query-regime: ANALYTIC_QUERY_V0
      x-conexus-sql-proof: SELECT_ONLY_REQUIRED
      x-conexus-contract-state: SCHEMA_CLOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [datasetSemanticId, selectSemanticIds]
              properties:
                datasetSemanticId:
                  type: string
                  minLength: 1
                selectSemanticIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
      responses:
        '200':
          description: Restricted semantic-ID analytical result produced only after exact Brain/binding/health admission and SELECT-only proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticQueryResult'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '409':
          $ref: './openapi.yaml#/components/responses/Problem409'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'
        '503':
          $ref: './openapi.yaml#/components/responses/Problem503'

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Untrusted reference only; current containment and authority are resolved server-side.
      schema:
        type: string
        minLength: 1
    BrainRevisionId:
      name: brainRevisionId
      in: path
      required: true
      description: Exact immutable Brain revision reference; disclosure/authority remain server-resolved.
      schema:
        type: string
        minLength: 1
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: Untrusted KnowledgeProposal reference; current Workspace containment and review authority are server-resolved.
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Untrusted Project reference; exact current Brain binding, health and query authority are resolved server-side.
      schema:
        type: string
        minLength: 1
  schemas:
    WorkspaceBrain:
      type: object
      additionalProperties: false
      required: [workspaceId, publishedBrainRevisionId]
      properties:
        workspaceId:
          type: string
          minLength: 1
        publishedBrainRevisionId:
          type: [string, 'null']
          minLength: 1
          description: Current Workspace-published Brain revision when one exists; Project adoption remains independently explicit.
    BrainRevision:
      type: object
      additionalProperties: false
      required: [brainRevisionId, brainDigest, sourceRevision, availability, reviewText]
      properties:
        brainRevisionId:
          type: string
          minLength: 1
        brainDigest:
          type: string
          minLength: 1
        sourceRevision:
          type: string
          minLength: 1
        availability:
          type: string
          const: AVAILABLE
        reviewText:
          type: string
          minLength: 1
          description: Deterministic Brain-owned human-readable projection of this exact sourceRevision for review/inspection; not canonical Brain source, source identity, digest or decision authority.
    BrainRevisionDetail:
      type: object
      additionalProperties: false
      required: [brainRevisionId, brainDigest, sourceRevision, availability, reviewText, knowledgeBrowse]
      properties:
        brainRevisionId:
          type: string
          minLength: 1
        brainDigest:
          type: string
          minLength: 1
        sourceRevision:
          type: string
          minLength: 1
        availability:
          type: string
          const: AVAILABLE
        reviewText:
          type: string
          minLength: 1
          description: Deterministic Brain-owned human-readable projection of this exact sourceRevision for review/inspection; not canonical Brain source, source identity, digest or decision authority.
        knowledgeBrowse:
          $ref: '#/components/schemas/BrainKnowledgeBrowseProjection'
    BrainKnowledgeBrowseProjection:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: '#/components/schemas/BrainKnowledgeDomainProjection'
          description: Business-aligned domain/namespace presentation resolved deterministically from the exact sourceRevision. Empty is a truthful known-empty projection, not an unknown/error substitute.
    BrainKnowledgeDomainProjection:
      type: object
      additionalProperties: false
      required: [domainRef, label, concepts]
      properties:
        domainRef:
          type: string
          minLength: 1
          description: Brain-issued coordinate scoped to this exact sourceRevision projection; not canonical source identity or a decision subject.
        label:
          type: string
          minLength: 1
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/BrainKnowledgeConceptProjection'
    BrainKnowledgeConceptProjection:
      type: object
      additionalProperties: false
      required: [conceptRef, label, summary, contentClasses, sections, provenanceRefs]
      properties:
        conceptRef:
          type: string
          minLength: 1
          description: Brain-issued coordinate scoped to this exact sourceRevision projection; supports local browse/navigation only and is not canonical semantic/source identity.
        label:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        contentClasses:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BrainKnowledgeContentClass'
        sections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrainKnowledgeSectionProjection'
        provenanceRefs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    BrainKnowledgeSectionProjection:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/BrainKnowledgeSectionKind'
        text:
          type: string
          minLength: 1
    BrainKnowledgeSectionKind:
      type: string
      enum: [DEFINITION, BUSINESS_MEANING, CALCULATION, GRAIN, RELATIONSHIPS, BUSINESS_RULES, CAVEATS, VERIFICATION]
    BrainKnowledgeContentClass:
      type: string
      enum: [SEMANTIC, KNOWLEDGE, EVIDENCE_SPEC]
    BrainDiscoveryCandidate:
      type: object
      additionalProperties: false
      required: [candidateRef, hypothesis, provenanceRefs]
      properties:
        candidateRef:
          type: string
          minLength: 1
        hypothesis:
          type: string
          minLength: 1
        provenanceRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    BrainDiscoveryResult:
      type: object
      additionalProperties: false
      required: [projectId, candidates]
      properties:
        projectId:
          type: string
          minLength: 1
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/BrainDiscoveryCandidate'
    SourceBackedKnowledgeProposalInput:
      type: object
      additionalProperties: false
      required: [candidateSourceRevision, provenanceRefs]
      properties:
        candidateSourceRevision:
          type: string
          minLength: 1
          description: Exact existing Brain-owned candidate source revision to submit for review.
        provenanceRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    DiscoveryBackedKnowledgeProposalInput:
      type: object
      additionalProperties: false
      required: [discoveryCandidateRef, humanResolution]
      properties:
        discoveryCandidateRef:
          type: string
          minLength: 1
          description: Untrusted exact Brain Discovery candidate reference; Brain re-resolves current Workspace/discovery containment and provenance server-side.
        humanResolution:
          type: string
          minLength: 1
          description: Explicit human confirmation/correction/resolution of the exact discovery hypothesis. It is semantic input for Brain-owned candidate-source materialization, not raw Git/source authority.
    KnowledgeProposal:
      type: object
      additionalProperties: false
      required: [proposalId, proposalRevision, candidateSourceRevision, provenanceRefs, hypothesisState, reviewState, reviewText]
      properties:
        proposalId:
          type: string
          minLength: 1
        proposalRevision:
          type: string
          minLength: 1
        candidateSourceRevision:
          type: string
          minLength: 1
        provenanceRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        hypothesisState:
          type: string
          minLength: 1
          description: Brain-owner hypothesis state; no lifecycle enum is invented by 4B.
        reviewState:
          type: string
          minLength: 1
          description: Brain-owner review state; no lifecycle enum is invented by 4B.
        reviewText:
          type: string
          minLength: 1
          description: Deterministic Brain-owned human-readable projection of this exact candidateSourceRevision for review/inspection; not canonical Brain source or proposal/decision identity.
    BrainHealthState:
      type: string
      enum: [UNVERIFIED, VALID, SUSPECT, INVALID, CHECK_ERROR]
    BrainHealthItem:
      type: object
      additionalProperties: false
      required: [semanticRef, state, critical]
      properties:
        semanticRef:
          type: string
          minLength: 1
        state:
          $ref: '#/components/schemas/BrainHealthState'
        critical:
          type: boolean
    BrainHealth:
      type: object
      additionalProperties: false
      required: [brainRevisionId, brainDigest, healthSnapshotDigest, items]
      properties:
        brainRevisionId:
          type: string
          minLength: 1
        brainDigest:
          type: string
          minLength: 1
        healthSnapshotDigest:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrainHealthItem'
    ProjectAnalyticQueryCatalog:
      type: object
      additionalProperties: false
      required: [projectId, brainRevisionId, brainDigest, projectBindingDigest, datasets]
      properties:
        projectId:
          type: string
          minLength: 1
        brainRevisionId:
          type: string
          minLength: 1
        brainDigest:
          type: string
          minLength: 1
        projectBindingDigest:
          type: string
          minLength: 1
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticDatasetChoice'
    AnalyticDatasetChoice:
      type: object
      additionalProperties: false
      required: [datasetSemanticId, label, selectableSemantics]
      properties:
        datasetSemanticId:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Server-owned human presentation of this admitted semantic dataset; never canonical identity or authorization.
        selectableSemantics:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticSemanticChoice'
    AnalyticSemanticChoice:
      type: object
      additionalProperties: false
      required: [semanticId, label]
      properties:
        semanticId:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Server-owned human presentation of this admitted semantic field; never canonical identity or authorization.
    AnalyticColumn:
      type: object
      additionalProperties: false
      required: [semanticId]
      properties:
        semanticId:
          type: string
          minLength: 1
    AnalyticScalar:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
    AnalyticRow:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticScalar'
    AnalyticQueryResult:
      type: object
      additionalProperties: false
      required: [effectiveBrainPlanDigest, projectBindingDigest, healthSnapshotDigest, datasetSemanticId, columns, rows, provenanceRefs]
