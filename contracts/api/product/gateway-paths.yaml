openapi: 3.1.2
info:
  title: Conexus Product API Gateway Path Items
  version: 4b-candidate
paths:
  /api/control/projects/{projectId}/effect-attempts:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted Project reference; current containment and audit disclosure are resolved server-side.
        schema:
          type: string
          minLength: 1
    get:
      summary: ListEffectAttempts
      operationId: ListEffectAttempts
      x-conexus-4a-id: GW-01
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      parameters:
        - name: originatingRun
          in: query
          required: false
          style: deepObject
          explode: true
          description: Optional exact owner-issued run coordinate. Both kind and ref are required when present; the filter is applied server-side before pagination and never grants authority over the originating run or effect.
          schema:
            $ref: '#/components/schemas/OriginatingRunRef'
        - name: pageToken
          in: query
          required: false
          description: Opaque continuation bound to the same exact Project, originatingRun filter and attemptedAt DESC / effectAttemptId DESC ordering; never authorization, effect identity or replay authority.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Currently disclosable Gateway effect-attempt evidence for the exact Project, optionally filtered by exact originatingRun before pagination and ordered by attemptedAt DESC then effectAttemptId DESC. Listing grants no retry, replay, reconciliation or effect-execution authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectAttemptPage'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'
        '422':
          $ref: './openapi.yaml#/components/responses/Problem422'

  /api/control/projects/{projectId}/effect-attempts/{effectAttemptId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Untrusted Project reference; current containment and audit disclosure are resolved server-side.
        schema:
          type: string
          minLength: 1
      - name: effectAttemptId
        in: path
        required: true
        description: Exact Gateway EffectAttempt reference; possession grants no replay/reconciliation/effect authority.
        schema:
          type: string
          minLength: 1
    get:
      summary: GetEffectAttempt
      operationId: GetEffectAttempt
      x-conexus-4a-id: GW-02
      x-conexus-ingress: [CONTROL_PLANE]
      x-conexus-current-state-carrier: NONE
      x-conexus-contract-state: SCHEMA_CLOSED
      responses:
        '200':
          description: Exact Gateway-owned receipt, reconciliation and provenance projection for one EffectAttempt; ambiguous external acceptance remains OUTCOME_UNKNOWN rather than false failure/success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectAttempt'
        '401':
          $ref: './openapi.yaml#/components/responses/Problem401'
        '403':
          $ref: './openapi.yaml#/components/responses/Problem403'
        '404':
          $ref: './openapi.yaml#/components/responses/Problem404'

components:
  schemas:
    OriginatingRunRef:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          minLength: 1
          description: Owner-issued run/occurrence class such as an AgentRun or JobRun; 4B does not invent a universal run-kind enum.
        ref:
          type: string
          minLength: 1
          description: Exact owner run/occurrence reference when the effect originated from one.
    EffectAttemptSummary:
      type: object
      additionalProperties: false
      required: [effectAttemptId, originatingOperationId, effectIdentity, outcome, attemptedAt]
      properties:
        effectAttemptId:
          type: string
          minLength: 1
        originatingOperationId:
          type: string
          minLength: 1
          description: Exact admitted Product/Project operation whose governed effect path produced this attempt.
        originatingRun:
          $ref: '#/components/schemas/OriginatingRunRef'
        effectIdentity:
          type: string
          minLength: 1
          description: Opaque Gateway-owned semantic effect/replay identity. Disclosure grants no replay authority.
        outcome:
          type: string
          minLength: 1
          description: Gateway-owner truth. Ambiguous external acceptance must remain OUTCOME_UNKNOWN rather than being coerced into success/failure.
        attemptedAt:
          type: string
          format: date-time
    EffectAttemptPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EffectAttemptSummary'
        nextPageToken:
          type: string
          minLength: 1
          description: Opaque continuation for the same list shape when more results exist.
    EvidenceRefs:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
    EffectReceipt:
      type: object
      additionalProperties: false
      required: [recordedAt, evidenceRefs]
      properties:
        recordedAt:
          type: string
          format: date-time
        externalReference:
          type: string
          minLength: 1
          description: Safe opaque external/provider reference when one is legitimately disclosable; never a raw provider payload.
        evidenceRefs:
          $ref: '#/components/schemas/EvidenceRefs'
    EffectReconciliation:
      type: object
      additionalProperties: false
      required: [state, observedAt, evidenceRefs]
      properties:
        state:
          type: string
          minLength: 1
          description: Gateway-owner reconciliation state; 4B does not invent a universal reconciliation lifecycle enum.
        observedAt:
          type: string
          format: date-time
        evidenceRefs:
          $ref: '#/components/schemas/EvidenceRefs'
    EffectAttempt:
      type: object
      additionalProperties: false
      required:
        - effectAttemptId
        - projectId
        - originatingOperationId
        - effectIdentity
        - effectSubjectDigest
        - outcome
        - attemptedAt
        - evidenceRefs
      properties:
        effectAttemptId:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        originatingOperationId:
          type: string
          minLength: 1
          description: Exact admitted Product/Project operation whose governed effect path produced this attempt.
        originatingRun:
          $ref: '#/components/schemas/OriginatingRunRef'
        effectIdentity:
          type: string
          minLength: 1
          description: Opaque Gateway-owned semantic effect/replay identity; it is evidence, not caller replay capability.
        effectSubjectDigest:
          type: string
          minLength: 1
          description: Digest of the exact sealed effect subject used for effect identity/reconciliation provenance; raw secret/provider payload is not exposed.
        outcome:
          type: string
          minLength: 1
          description: Gateway-owner effect truth. Possible external acceptance with an ambiguous response must preserve OUTCOME_UNKNOWN and fence blind replay/new duplicate-scope admission.
        attemptedAt:
          type: string
          format: date-time
        receipt:
          $ref: '#/components/schemas/EffectReceipt'
        reconciliation:
          $ref: '#/components/schemas/EffectReconciliation'
        evidenceRefs:
          $ref: '#/components/schemas/EvidenceRefs'
